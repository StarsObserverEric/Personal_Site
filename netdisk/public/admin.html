<style>
/* ═══════════════════════════════════════════════════════════
   默认主题：简洁暗色（无玻璃模糊）
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg-page: #0f0f10;
  --orb-1: transparent; --orb-2: transparent; --orb-3: transparent;
  --orb-opacity: 0;

  --glass: #1c1c1f;
  --glass-strong: #242428;
  --stroke: rgba(255,255,255,.08);
  --stroke-strong: rgba(255,255,255,.14);

  --text: #f0f0f2;
  --text-2: rgba(255,255,255,.58);
  --text-3: rgba(255,255,255,.34);

  --sf-soft: rgba(255,255,255,.04);
  --sf: rgba(255,255,255,.055);
  --sf-strong: rgba(255,255,255,.09);
  --sf-input: rgba(255,255,255,.07);
  --sf-input-focus: rgba(255,255,255,.11);

  --shadow-soft: 0 2px 8px rgba(0,0,0,.4);
  --shadow-topbar: 0 2px 6px rgba(0,0,0,.4);
  --shadow-inset-hi: none;
  --shadow-glass: 0 1px 3px rgba(0,0,0,.5);
  --shadow-topbar-box: 0 1px 3px rgba(0,0,0,.5);
  --shadow-modal: 0 10px 40px rgba(0,0,0,.5);
  --shadow-btn-primary: 0 2px 6px rgba(10,124,255,.3);
  --shadow-btn-danger: 0 2px 6px rgba(255,69,58,.18);
  --shadow-btn-plain: 0 1px 0 rgba(0,0,0,.5);
  --shadow-btn-plain-hover: 0 1px 4px rgba(0,0,0,.5);
  --shadow-spinner-track: rgba(255,255,255,.12);
  --shadow-switch-thumb: 0 1px 3px rgba(0,0,0,.5);
  --shadow-toast: 0 6px 20px rgba(0,0,0,.6);
  --shadow-logo: none;

  --scrollbar-thumb: rgba(255,255,255,.12);
  --track-bg: rgba(255,255,255,.1);
  --bar-bg: rgba(255,255,255,.1);
  --tbl-divider: rgba(255,255,255,.06);

:root[data-theme="apple-dark"] {

  --shadow-soft: 0 16px 44px rgba(0,0,0,.35);
  --shadow-topbar: 0 14px 40px rgba(0,0,0,.4);
  --shadow-inset-hi: inset 0 1px 0 rgba(255,255,255,.22);
  --shadow-glass: 0 16px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
  --shadow-topbar-box: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
  --shadow-modal: 0 -20px 60px rgba(0,0,0,.5);
  --shadow-btn-primary: 0 8px 22px rgba(10,124,255,.38), inset 0 1px 0 rgba(255,255,255,.35);
  --shadow-btn-danger: 0 4px 14px rgba(255,69,58,.2);
  --shadow-spinner-track: rgba(255,255,255,.18);
  --shadow-switch-thumb: 0 3px 8px rgba(0,0,0,.35);
  --shadow-toast: 0 12px 32px rgba(0,0,0,.45);

  --scrollbar-thumb: rgba(255,255,255,.15);
  --track-bg: rgba(255,255,255,.14);
  --bar-bg: rgba(255,255,255,.12);
  --tbl-divider: rgba(255,255,255,.06);
  --tbl-hover: rgba(255,255,255,.05);
  --tbl-row-border: rgba(255,255,255,.07);
  --dashed-border: rgba(255,255,255,.28);
  --dropzone-bg: rgba(255,255,255,.045);
  --dropzone-hover-bg: rgba(255,255,255,.1);
  --dashed-border-strong: rgba(255,255,255,.5);
  --btn-hover-bg: rgba(255,255,255,.17);
  --btn-danger-bg: rgba(255,69,58,.16);
  --btn-danger-bg-hover: rgba(255,69,58,.26);

}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
  min-height: 100vh; color: var(--text); position: relative; overflow-x: hidden;
  background: var(--bg-page);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: rgba(10,132,255,.35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }

/* ── 背景光斑 ─────────────────────────── */
.orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .45; pointer-events: none; animation: drift 22s ease-in-out infinite alternate; z-index: 0; }
.o1 { width: 52vmax; height: 52vmax; background: var(--orb-1); top: -20%; left: -16%; opacity: var(--orb-opacity); }
.o2 { width: 44vmax; height: 44vmax; background: var(--orb-2); bottom: -22%; right: -12%; animation-delay: -8s; opacity: var(--orb-opacity); }
.o3 { width: 30vmax; height: 30vmax; background: var(--orb-3); top: 48%; left: 12%; animation-delay: -15s; opacity: var(--orb-opacity); }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(5vw,-6vh) scale(1.15); } }

/* ── 布局（横向拉满）───────────────────── */
#app { position: relative; z-index: 1; }
/* 取消原来的 max-width:1280px —— 默认铺满整个视口宽度。
   只留左右内边距，且用 clamp 控制上限，避免超宽屏时元素贴边。 */
.wrap { max-width: none; width: 100%; margin: 0; padding: 14px clamp(12px, 1.4vw, 40px) 60px; }
.layout { display: flex; gap: 18px; align-items: flex-start; }
.layout #view { flex: 1; min-width: 0; }

/* ── 侧边栏折叠（顶栏左端按钮切换）────── */
#app.sb-collapsed .sidebar { display: none; }
#app.sb-collapsed .layout { gap: 0; }
.sb-toggle {
  flex: none; width: 38px; height: 38px; padding: 0; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--sf); border: 1px solid var(--stroke); color: var(--text);
  font-size: 15px; line-height: 1; font-family: inherit;
  transition: background .18s, transform .15s;
}
.sb-toggle:hover { background: var(--sf-strong); }
.sb-toggle:active { transform: scale(.94); }

/* ── 宽屏自动分列（统一机制：grid + JS 分列）──────────────
   容器加 class="auto-cols"，JS 调用 flowColumns() 把直接子项按列优先均分进 .fcol。
   列数由 --ui-cols 决定 —— 与文件管理器/其它列表页**共用同一个全局列数**。

   ⚠️ 为什么**不再用 CSS `columns`（多列）**：
   多列在内容放不下时会把卡片从中间切开，并把文字溢出压到下一张卡片上
   （实测：设置页「下载市场作为首页」的说明文字压到下方卡片）。
   grid 的每个单元格是独立的，永远不会重叠；代价是需要 JS 分列 —— 但反正列数
   本来就是 JS 算出来的，这个代价为零。 */
.auto-cols {
  display: grid; gap: 14px; align-items: start;
  grid-template-columns: repeat(var(--ui-cols, 1), minmax(0, 1fr));
}
.auto-cols > .fcol { min-width: 0; }

/* ── 列数控制：不支持分列的页面整体压暗并禁用 ── */
.colctl.off { opacity: .45; }

/* ── 顶栏：列数调节（自动 + 手动）───────────────
   中间显示的是"当前生效列数"；**点它**即把手动偏置归零，回到纯自动。
   手动只调 **偏置（bias）**，不锁死具体数值 —— 这样拖动/缩放窗口时列数依旧会自动增减，
   同时用户按 ± 也能在当前基础上增减：两种需求同时成立。 */
.colctl {
  display: flex; align-items: center; gap: 2px; padding: 3px 4px;
  border-radius: 12px; background: var(--sf); border: 1px solid var(--stroke);
}
.colctl button {
  flex: none; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: 16px; line-height: 1;
  color: var(--text); background: transparent;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .12s;
}
.colctl button:hover { background: var(--sf-strong); }
.colctl button:active { transform: scale(.9); }
.colctl button[disabled] { opacity: .3; pointer-events: none; }
.colctl .lbl {
  min-width: 42px; text-align: center; cursor: pointer; user-select: none;
  font-size: 10.5px; color: var(--text-3); line-height: 1.15;
}
.colctl .lbl b {
  display: block; font-size: 12.5px; font-weight: 700; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.colctl .lbl.manual b { color: #fbbf24; }

/* ── 文件管理器（资源管理器风格）─────────────── */
.fm-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.crumb { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13px; min-width: 0; }
.crumb a { color: var(--text-2); cursor: pointer; padding: 4px 8px; border-radius: 9px; white-space: nowrap; }
.crumb a:hover { background: var(--sf-strong); color: var(--text); }
.crumb .sep { color: var(--text-3); opacity: .6; }
.fm-seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--sf); border: 1px solid var(--stroke); }
.fm-seg button {
  border: 0; background: transparent; color: var(--text-2); font: inherit;
  font-size: 12.5px; padding: 6px 12px; border-radius: 9px; cursor: pointer;
}
.fm-seg button.on { background: var(--sf-strong); color: var(--text); font-weight: 600; }
.fm-sizer { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
.fm-sizer input[type=range] { width: 120px; }

/* 多列并行：列数 = JS 算出的自动值 + 手动偏置，写进 --ui-cols */
.fmc { display: grid; gap: 14px; align-items: start; grid-template-columns: repeat(var(--ui-cols, 1), minmax(0, 1fr)); }
.fmc > .fcol { min-width: 0; }

/* 详细信息：固定表格布局 —— 列宽不足时截断而不是把整页撑破 */
.fm-tbl { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.fm-tbl th {
  text-align: left; padding: 8px 9px; color: var(--text-3); font-weight: 600; font-size: 11.5px;
  border-bottom: 1px solid var(--tbl-divider); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 表头排序（Windows 资源管理器风格）：整格可点，箭头跟在列名后面
   —— 换算过颜色变量，浅色/深色两套主题都用的是同一批 CSS 变量，不用写两份 */
th.sortable { cursor: pointer; user-select: none; transition: color .12s, background .12s; }
th.sortable:hover { color: var(--text); background: var(--tbl-hover); }
th.sortable:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; border-radius: 6px; }
th.sortable .ar { font-style: normal; font-size: 9px; margin-left: 4px; opacity: .3; }
th.sortable.sorted { color: var(--text); }
th.sortable.sorted .ar { opacity: 1; color: var(--blue); }

.fm-tbl td {
  padding: 9px; border-bottom: 1px solid var(--tbl-divider);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
}
.fm-tbl tbody tr:hover { background: var(--tbl-hover); }
.fm-tbl .num { font-variant-numeric: tabular-nums; }
.fm-tbl .nm { display: flex; align-items: center; gap: 7px; min-width: 0; }
.fm-tbl .nm .tx { overflow: hidden; text-overflow: ellipsis; }
.fm-act { display: flex; gap: 5px; }
.fm-act button {
  border: 0; background: var(--sf); color: var(--text-2); border-radius: 8px;
  width: 26px; height: 26px; cursor: pointer; font-size: 13px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.fm-act button:hover { background: var(--sf-strong); color: var(--text); }
.fm-act button.dg:hover { background: rgba(255,69,58,.18); color: #ffb3ae; }

/* 缩略图模式 */
.fm-thumbs { display: grid; gap: 12px; grid-template-columns: repeat(var(--ui-cols, 4), minmax(0, 1fr)); }
.thumb { border-radius: 14px; overflow: hidden; background: var(--sf); border: 1px solid var(--stroke); position: relative; }
/* 缩略图卡片左上角的勾选框：默认半透明，勾选后高亮 —— 缩略图模式下也能多选 */
.thumb-ck {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  padding: 3px 4px; border-radius: 8px;
  background: rgba(0,0,0,.42); backdrop-filter: none;
}
.thumb-ck .fm-ck { margin: 0; }
.thumb-ck:has(.fm-ck:checked) { background: rgba(10,132,255,.9); }
.thumb .pv {
  width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
  display: flex; align-items: center; justify-content: center; background: var(--track-bg);
}
.thumb .pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* 缩略图是"滚到附近才挂 src"，没挂上的位置给一点低调微光占位，别是一片死板 */
.thumb .pv img.timg:not([src]) {
  background: linear-gradient(100deg, var(--track-bg) 25%, rgba(128,140,160,.16) 45%, var(--track-bg) 65%);
  background-size: 240% 100%;
  animation: thumbPh 1.4s linear infinite;
}
@keyframes thumbPh { from { background-position: 0% 0; } to { background-position: -240% 0; } }
.thumb .pv .ph { font-size: 26px; color: var(--text-3); }
.thumb .mt { padding: 7px 9px; border-top: 1px solid var(--stroke); }
.thumb .mt .n { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .mt .s { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* 投放区：既保留单独的投放条，也支持把文件拖到整个内容区 */
.fm-drop {
  border: 1px dashed var(--stroke-strong); border-radius: 14px; padding: 14px;
  text-align: center; color: var(--text-3); font-size: 12.5px; margin-bottom: 12px;
  transition: background .15s, border-color .15s;
}
.fm-drop.over { background: var(--sf-strong); border-color: #0a84ff; color: var(--text); }
.fm-host.over { outline: 2px dashed #0a84ff; outline-offset: 4px; border-radius: 14px; }

/* 多选：行首复选框 + 顶部"已选 N 项"操作条 */
.fm-sel {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px;
  background: rgba(10,132,255,.12); border: 1px solid rgba(10,132,255,.35); font-size: 12.5px;
}
.fm-tbl th.ck, .fm-tbl td.ck { width: 34px; padding-left: 2px; padding-right: 0; }
/* ⚠️ 列表里所有复选框必须**同一尺寸**：以前只有 .fm-ck 显式给了 15px，
   而表头全选（.fm-all）、存储浏览（.stg-chk / #stg-check-all）走的是浏览器默认
   尺寸（Chrome 约 13px），看着就像"左上角那个白框比下面的小一圈"。
   统一在这里声明，别再只给其中一类加宽高。 */
.fm-ck, .fm-all, .stg-chk, .tbl th input[type="checkbox"], .tbl td input[type="checkbox"] {
  width: 15px; height: 15px; accent-color: #0a84ff; cursor: pointer; vertical-align: middle;
}

/* ── 概览：容量卡片 + 两张饼图 ── */
.cap-bar { height: 10px; border-radius: 6px; background: var(--track-bg); overflow: hidden; margin: 2px 0 16px; }
.cap-bar i {
  display: block; height: 100%; border-radius: 6px;
  background: linear-gradient(90deg, #34d399, #0a84ff);
  transition: width .45s cubic-bezier(.22,1,.36,1);
}
.cap-bar.warn i { background: linear-gradient(90deg, #fbbf24, #ff453a); }
.cap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.cap-box { min-width: 0; }
.cap-box h3 {
  font-size: 13px; font-weight: 650; color: var(--text-2);
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.cap-pie { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pie { flex: none; }
.legend { flex: 1; min-width: 128px; display: flex; flex-direction: column; gap: 6px; }
.lg-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.lg-row i { flex: none; width: 10px; height: 10px; border-radius: 3px; }
.lg-row .lg-n {
  flex: 1; min-width: 0; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lg-row .lg-v { flex: none; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 玻璃卡片 ─────────────────────────── */
.glass {
  background: var(--glass);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  box-shadow: var(--shadow-glass);
}
:root[data-theme="apple"] .glass,
:root[data-theme="apple-dark"] .glass {
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .glass { border: 1px solid var(--stroke-strong); }

/* ── 顶栏 ─────────────────────────────── */
.topbar {
  /* 常驻顶部：top:0 贴住视口上沿，滚动不隐藏；nowrap 保证各项不换行、不被截断 */
  position: sticky; top: 0; z-index: 60; margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px; padding: 11px 16px;
  flex-wrap: nowrap; white-space: nowrap;
  background: var(--glass-strong);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--stroke); border-radius: 22px;
  box-shadow: var(--shadow-topbar-box);
}
:root[data-theme="apple"] .topbar,
:root[data-theme="apple-dark"] .topbar {
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .topbar { border: 1px solid var(--stroke-strong); box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25); }
.logo { width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
  background: linear-gradient(150deg, #67e8f9, #3b82f6 55%, #8b5cf6);
  box-shadow: var(--shadow-logo); }
.logo svg { width: 22px; height: 22px; }
/* 顶栏头像：图片盖在渐变底上（object-fit 裁成方形）；加载失败就隐掉，露出底下那枚图标兜底。
   整块是 <a>，点它回站点主页，所以这里要压掉 <a> 的蓝字与下划线。 */
a.logo-link { flex: none; }
a.logo-link .logo-av {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: inherit; display: block; background: var(--sf);
}
a.logo-link:hover .logo-av { opacity: .85; }
a.logo-link::after { content: ""; }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.topbar .sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.topbar .spacer { flex: 1; }
.traffic-pill {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 14px;
  background: var(--sf); border: 1px solid var(--stroke);
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap;
  transition: background .2s;
}
.traffic-pill:hover { background: var(--sf-strong); }
.traffic-pill .bar { width: 52px; height: 5px; border-radius: 3px; background: var(--track-bg); overflow: hidden; }
.traffic-pill .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .5s cubic-bezier(.22,1,.36,1); }
.traffic-pill.danger .bar i { background: linear-gradient(90deg,#fbbf24,#ff453a); }
.traffic-pill.danger { color: #ffb3ae; }

/* ── 侧边栏导航 ────────────────────────── */
.sidebar {
  flex: none; width: 188px; padding: 14px 10px;
  background: var(--glass);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--stroke); border-radius: 22px;
  box-shadow: var(--shadow-glass);
  display: flex; flex-direction: column; gap: 4px; position: sticky; top: 90px;
  max-height: calc(100vh - 110px); overflow-y: auto; scrollbar-width: thin;
}
:root[data-theme="apple"] .sidebar,
:root[data-theme="apple-dark"] .sidebar {
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .sidebar { border: 1px solid var(--stroke-strong); box-shadow: 0 16px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22); }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
.sb-main {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 14px; cursor: pointer;
  color: var(--text-2); font-size: 14px; font-weight: 600;
  background: transparent; border: none; font-family: inherit; text-align: left;
  transition: all .22s; width: 100%; user-select: none;
}
.sb-main:hover { background: var(--sf); color: var(--text); }
.sb-main .ic { font-size: 17px; width: 22px; text-align: center; flex: none; }
.sb-main .chev { margin-left: auto; font-size: 10px; opacity: .5; transition: transform .25s; }
.sb-main.open { color: var(--text); background: var(--sf-strong); box-shadow: var(--shadow-inset-hi); }
.sb-main.open .chev { transform: rotate(90deg); opacity: .8; }
.sb-main.single .chev { display: none; }
.sb-sub {
  overflow: hidden; max-height: 0; transition: max-height .35s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column; gap: 2px; padding-left: 24px;
}
.sb-sub.open { max-height: 400px; }
.sb-sub button {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 10px; cursor: pointer;
  color: var(--text-3); font-size: 13px; font-weight: 500;
  background: transparent; border: none; font-family: inherit; text-align: left;
  transition: all .18s; width: 100%; user-select: none;
}
.sb-sub button:hover { color: var(--text); background: var(--sf); }
.sb-sub button.active {
  color: var(--text); background: rgba(10,132,255,.15);
  box-shadow: inset 2px 0 0 #0a84ff, var(--shadow-inset-hi);
  font-weight: 600;
}

/* ── 移动端折叠 ───────────────────────── */
@media (max-width: 760px) {
  .layout { flex-direction: column; }
  .sidebar {
    position: static; width: 100%; max-height: none;
    flex-direction: row; flex-wrap: wrap; gap: 6px;
    padding: 10px;
  }
  .sb-main { padding: 7px 12px; font-size: 13px; }
  .sb-main .chev { display: none; }
  .sb-sub { display: none; }
}

/* ── 统计卡片 ─────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card { padding: 20px 22px; border-radius: 22px; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
.stat-card:nth-child(2){animation-delay:.05s}.stat-card:nth-child(3){animation-delay:.1s}.stat-card:nth-child(4){animation-delay:.15s}
.stat-card .label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.stat-card .value { margin-top: 8px; font-size: 27px; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-card .value small { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
.progress { margin-top: 12px; height: 7px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .6s cubic-bezier(.22,1,.36,1); }
.progress.hot i { background: linear-gradient(90deg,#fbbf24,#ff453a); }
.stat-card .foot { margin-top: 8px; font-size: 12px; color: var(--text-3); }

/* ── 通用卡片区块 ─────────────────────── */
.section { padding: 22px; margin-bottom: 18px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.section-title h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }

/* ── 图表 ─────────────────────────────── */
.chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; min-width: 0; height: 100%; }
.chart .bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, rgba(103,232,249,.95), rgba(59,130,246,.55));
  box-shadow: var(--shadow-inset-hi); transition: height .7s cubic-bezier(.22,1,.36,1); min-height: 3px; position: relative; }
.chart .bar:hover { background: linear-gradient(180deg, #67e8f9, #3b82f6); }
.chart .bar span { position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-2); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.chart .bar:hover span { opacity: 1; }
.chart .day { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── 表格 ─────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; padding: 9px 10px; color: var(--text-3); font-weight: 600; font-size: 12px;
  border-bottom: 1px solid var(--stroke); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--tbl-divider); white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr { transition: background .15s; }
.tbl tbody tr:hover { background: var(--tbl-hover); }
.tbl .num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 12.5px; }
.name-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

/* ── 存储浏览的辅助排版 ───────────────────
   文件名一行是真实文件名，下面那行灰字是存储桶里的原始对象 key（R2/S3 的真实身份）。 */
.stg-nm { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stg-key { font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; font-size: 11px;
  color: var(--text-3); opacity: .62; max-width: 320px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.stg-owner { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.stg-loc { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

/* ── 「定位过去」时的高亮（5 秒后由 JS 摘掉 class） ──
   用 outline + 背景渐变，暗色亮蓝、亮色亮绿，两种主题下都看得清。 */
@keyframes hlPulse {
  0%   { background: var(--hl-strong); }
  55%  { background: var(--hl-strong); }
  70%  { background: var(--hl-soft); }
  100% { background: transparent; }
}
tr.hl-tmp > td, div.hl-tmp {
  animation: hlPulse 5s linear forwards;
  border-radius: 8px;
}
.empty { padding: 44px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
.empty .icon { font-size: 34px; margin-bottom: 10px; opacity: .7; }

/* ── 文件图标 ─────────────────────────── */
.ficon { width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; letter-spacing: -.02em;
  background: var(--sf-input); border: 1px solid var(--stroke);
  box-shadow: var(--shadow-inset-hi); vertical-align: middle; }

/* ── 按钮 ─────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border: 1px solid var(--stroke-strong); border-radius: 14px;
  background: var(--glass-strong); color: var(--text); font-size: 13.5px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s cubic-bezier(.22,1.2,.36,1); white-space: nowrap;
  box-shadow: var(--shadow-btn-plain);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.btn:hover { background: var(--btn-hover-bg); box-shadow: var(--shadow-btn-plain-hover); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.97); box-shadow: var(--shadow-btn-plain); }
.btn.primary {
  background: linear-gradient(180deg,#4fa5ff,#0a7cff); border-color: transparent;
  box-shadow: var(--shadow-btn-primary); color: #fff;
}
.btn.primary:hover { filter: brightness(1.05); box-shadow: 0 6px 18px rgba(10,124,255,.35); transform: translateY(-1px); }
.btn.primary:active { transform: translateY(0) scale(.97); }
.btn.danger {
  background: var(--btn-danger-bg); border-color: var(--btn-danger-border); color: var(--btn-danger-color);
  box-shadow: none;
}
.btn.danger:hover { background: var(--btn-danger-bg-hover); box-shadow: var(--shadow-btn-danger); }
.btn.danger:active { background: var(--btn-danger-bg-active); }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 11px; box-shadow: none; }
.btn.sm:hover { box-shadow: var(--shadow-btn-plain-hover); }
.btn[disabled] { opacity: .4; pointer-events: none; }
/* 下载按钮（用户明确要求：放在「移动到…」左边、绿色） */
.btn.ok {
  background: linear-gradient(180deg,#3ddc84,#1fb573); border-color: transparent; color: #06251a;
  box-shadow: 0 4px 14px rgba(31,181,115,.3);
}
.btn.ok:hover { filter: brightness(1.06); box-shadow: 0 6px 18px rgba(31,181,115,.4); transform: translateY(-1px); }
.btn.ok:active { transform: translateY(0) scale(.97); }
/* 选中了文件夹时置灰：浏览器根本下不了目录，给个灰键比点了没反应强 */
.btn.ok[disabled] { background: var(--sf-strong); color: var(--text-3); box-shadow: none; filter: none; }

/* ── 条目光标（点一下先高亮，空格 / Enter / 双击才打开预览）───────────
   和复选框"已选"是两回事：复选框 = 批量操作的范围，光标 = 我现在指着哪一行。 */
.thumb.cur { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,132,255,.5); }
.fm-tbl tr.cur > td, .tbl tr.cur > td { background: rgba(10,132,255,.16) !important; }
.fm-tbl tr.cur:hover > td, .tbl tr.cur:hover > td { background: rgba(10,132,255,.22) !important; }

/* ── 图片预览（像手机相册一样全屏）─────────────────────────────── */
#lb {
  position: fixed; inset: 0; z-index: 400;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  animation: lbIn .2s ease-out;
}
#lb.lb-out { animation: lbOut .16s ease-in forwards; }
/* 背景先压暗、再一路压到纯黑（用户明确要的"背景压低亮度一直到黑色"） */
#lb .lb-bg {
  position: absolute; inset: 0; background: #000; cursor: zoom-out;
  animation: lbBg .28s ease-out forwards;
}
@keyframes lbBg { from { background: rgba(0,0,0,.3); } to { background: #000; } }
@keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes lbOut { to { opacity: 0; } }
/* ⚠️ 这里刻意**不加** max-width/max-height：布局尺寸必须等于原图真实尺寸，
   否则"双击 1:1"会被 CSS 缩成"铺满屏幕"（4200px 的图永远显示不出真实像素）。
   初始缩放由 JS 算 fit = min(1, 视口/原图)，铺不满屏幕就是 1:1 起步。 */
#lb .lb-img {
  position: absolute; left: 50%; top: 50%;
  transform-origin: 50% 50%; will-change: transform; user-select: none;
  -webkit-user-drag: none; cursor: grab; box-shadow: 0 24px 80px rgba(0,0,0,.75);
}
/* 原图还在路上时：拿手头那张小图当模糊底衬（相册里那股"先糊后清"的观感） */
/* pointer-events:none —— 底衬铺满整屏，不设的话它会把黑边上的点击/滚轮全吃掉，
   变成"点黑边关不掉预览"。 */
#lb .lb-ph {
  position: absolute; inset: 0; opacity: .85; transform: scale(1.06); filter: blur(26px);
  background-repeat: no-repeat; background-position: center; background-size: contain;
  pointer-events: none;
}
#lb .lb-img.drag { cursor: grabbing; }
#lb .lb-spin {
  position: absolute; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.22); border-top-color: #fff; pointer-events: none;
  animation: lbSpin .8s linear infinite;
}
@keyframes lbSpin { to { transform: rotate(360deg); } }
#lb .lb-tip {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3;
  color: rgba(255,255,255,.55); font-size: 12px; white-space: nowrap; pointer-events: none;
}
#lb .lb-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 26px 20px 12px;
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  color: rgba(255,255,255,.75); font-size: 12.5px; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.75));
}
#lb .lb-bar .nm { font-weight: 650; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }

/* ── 上传区 ───────────────────────────── */
.dropzone {
  margin-bottom: 18px; padding: 34px 20px; text-align: center; cursor: pointer;
  border: 1.5px dashed var(--dashed-border); border-radius: var(--radius);
  background: var(--dropzone-bg); transition: all .2s;
}
.dropzone:hover, .dropzone.over { background: var(--dropzone-hover-bg); border-color: var(--dashed-border-strong); transform: scale(1.005); }
.dropzone .icon { font-size: 34px; margin-bottom: 10px; }
.dropzone .t { font-size: 15px; font-weight: 650; }
.dropzone .d { margin-top: 6px; font-size: 12.5px; color: var(--text-3); }
.upload-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-top: 10px;
  border-radius: 16px; background: var(--sf); border: 1px solid var(--stroke); font-size: 13.5px; }
.upload-item .prog { flex: 1; height: 6px; border-radius: 3px; background: var(--bar-bg); overflow: hidden; }
.upload-item .prog i { display: block; height: 100%; width: 0; border-radius: 3px;
  background: linear-gradient(90deg,#34d399,#0a84ff); transition: width .2s; }
.upload-item .pct { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }

.group .row {

.group .row:last-child { border-bottom: none; }
.group .row:hover { background: var(--tbl-hover); }
.group .row .info { flex: 1; min-width: 0; }
.group .row .info .t { font-size: 14.5px; font-weight: 600; }
.group .row .info .d { margin-top: 3px; font-size: 12.5px; color: var(--text-3); line-height: 1.5; }
.group .row input[type=number], .group .row input[type=text] {
  width: 110px; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; font-family: inherit;
  color: var(--text); background: var(--sf-input); border: 1px solid var(--stroke-strong); outline: none; text-align: right;
  font-variant-numeric: tabular-nums;

.group .row input[type=number]:focus { border-color: rgba(10,132,255,.7); }
.group .row input[type=text] { width: 170px; text-align: left; }

   在 20px 圆角处看着像"溢出卡片"。这里补上左右内边距与字号，与 .row 对齐。 */

.group .row .info .d,
.group > .tip,
.field .tip,
.crumb a,
.thumb .mt .n { overflow-wrap: anywhere; }

/* iOS 开关 */
.switch { position: relative; width: 50px; height: 30px; flex: none; cursor: pointer; }

.switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--track-bg); transition: background .25s; }
.switch .thumb { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%;

.switch input:checked + .track { background: linear-gradient(180deg,#3d9bff,#0a7cff); }

.modal-mask { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;

  animation: fadeIn .25s both; }

.modal {

  border: 1px solid var(--stroke); border-bottom: none;
  box-shadow: var(--shadow-modal);
  animation: sheetUp .4s cubic-bezier(.22,1.1,.36,1) both;
}
@media (min-width: 640px) { .modal { border-radius: 32px; border-bottom: 1px solid var(--stroke); } }
:root[data-theme="apple"] .modal,
:root[data-theme="apple-dark"] .modal {
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 0.5px solid rgba(0,0,0,.08);
}
:root[data-theme="apple-dark"] .modal { border: 1px solid var(--stroke-strong); box-shadow: 0 -20px 60px rgba(0,0,0,.5), var(--shadow-inset-hi); }

:root[data-theme="apple-dark"] .toast { border: 1px solid var(--stroke-strong); box-shadow: 0 12px 32px rgba(0,0,0,.45); }

@keyframes sheetUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
.modal .sub { font-size: 13px; color: var(--text-3); margin-bottom: 18px; }
.modal .actions { display: flex; gap: 10px; margin-top: 20px; }
.modal .actions .btn { flex: 1; padding: 13px; font-size: 15px; border-radius: 16px; }

   否则会以为删除弹窗只有两个键。所以锁的是按键本身 + 一条进度条。 */

.dl-cd { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-3); white-space: nowrap; }

.dl-bar-row { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--stroke);

.dl-bar-row .dl-cd { font-size: 13px; font-weight: 650; color: var(--red); }
.link-box { display: flex; gap: 8px; margin-top: 4px; }
.link-box input { flex: 1; padding: 12px 14px; border-radius: 14px; font-size: 14px;

  background: var(--sf-input); border: 0.5px solid rgba(0,0,0,.1); outline: none; }

/* ── Toast ────────────────────────────── */
#toasts { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px 11px 22px; border-radius: 16px; font-size: 14px; font-weight: 600; color: var(--text);

  border: 1px solid var(--stroke); box-shadow: var(--shadow-toast);

.pager .info { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.login-card { width: 100%; max-width: 380px; padding: 44px 34px 36px; text-align: center;
  border-radius: 36px; animation: fadeUp .6s cubic-bezier(.22,1.1,.36,1) both; }

  color: var(--text); background: var(--sf-input); border: 1px solid var(--stroke-strong); outline: none; text-align: center;
  transition: border .2s, background .2s; }
.login-card input:focus { border-color: rgba(10,132,255,.75); background: var(--sf-input-focus); }
.login-card .btn { width: 100%; margin-top: 14px; padding: 15px; font-size: 16px; border-radius: 18px; }
.login-card .err { margin-top: 12px; font-size: 13px; color: #fda293; min-height: 18px; }
.login-card .lang-row { margin-top: 18px; }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--shadow-spinner-track); border-top-color: var(--text); animation: spin .8s linear infinite; margin: 30px auto; }

.actions-cell { display: flex; gap: 6px; }

  .tbl th:nth-child(n+5), .tbl td:nth-child(n+5) { display: none; }
  .topbar .sub { display: none; }
}

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

async function api(path, opts={}){
  const r = await fetch(path, { credentials:'same-origin', ...opts,
    headers: { ...(opts.body && !(opts.body instanceof FormData) ? {'content-type':'application/json'} : {}), ...(opts.headers||{}) } });
  let data = null;
  try { data = await r.json(); } catch {}
  // 会话过期（401）时回到 /login 完整登录页：本 SPA 内置登录卡片没有 GitHub / OAuth 按钮，
  // 会话默默过期后会让人以为"GitHub 登录入口消失了"。
  if(r.status === 401 && !path.includes('/login')) { location.replace('/login'); throw new Error('unauthorized'); }

  const el = document.createElement('div');

  const x = document.createElement('button');
  x.type = 'button';
  x.className = 'toast-x';

  x.title = t('close');

    el.dataset.done = '1';

}

/* ═══════════ 删除弹窗：软删除 / 彻底删除 ═══════════
 *
 * 「彻底删除」是不可逆的，所以按用户要求上两道锁：
 *   ① 弹窗里的「彻底删除」按钮默认灰着，旁边走 5 秒倒计时，倒计时走完才可点；
 *   ② 点下去还有二次确认，那一次的「确定」同样锁 5 秒；第二次点「取消」直接回文件列表。
 * 普通的「确定」（移入回收站，30 天内可还原）不设锁，别让常用路径变麻烦。
 *
 * deleteDialog → 'soft' | 'purge' | null(取消)
 * purgeDialog  → true(真的删) | false(取消，什么都不做)
 */
const COOLDOWN_SEC = 5;

/** 跑一个 n 秒倒计时；返回 {stop, onUnlock} 手动收尾用 */
function runCooldown(sec, set, done){
  let left = sec;
  const timer = setInterval(() => {
    left -= 1;
    if(left <= 0){ clearInterval(timer); done(); return; }
    set(left);
  }, 1000);
  return timer;
}

function deleteDialog(total){
  const zh = LANG === 'zh';
  return new Promise(resolve => {
    openModal(`
      <h3>${esc(t('confirmDeleteNT'))}</h3>
      <div class="sub">${esc(t('confirmDeleteND', { n: total }))}</div>
      <div class="actions">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn danger" data-ok>${esc(t('confirm'))}</button>
      </div>
      <div class="dl-purge">
        <button class="btn" id="dl-purge" disabled>🗑️ ${esc(t('purgeOpt'))}</button>
        <span class="dl-cd" id="dl-cd">${esc(t('purgeCd', { n: COOLDOWN_SEC }))}</span>
        <span class="dl-bar"><i id="dl-bar-i"></i></span>
      </div>`, () => finish(null));
    const btn = $('#dl-purge'), cd = $('#dl-cd'), bar = $('#dl-bar-i');
    let timer = null;
    // ⚠️ finish 必须顺手 closeModal()：confirmDialog 是在 onclick 里 close 的，
    // 这里把关闭动作挪进 finish，否则"取消"之后那层弹窗还挂在屏幕上（看着像卡住了）。
    const finish = (v) => { if(timer) clearInterval(timer); closeModal(); resolve(v); };
    timer = runCooldown(COOLDOWN_SEC,
      (n) => { if(cd) cd.textContent = t('purgeCd', { n }); if(bar) bar.style.width = (100 - n * 100 / COOLDOWN_SEC) + '%'; },
      () => {
        btn.disabled = false;
        if(cd) cd.textContent = t('purgeUnlocked');
        if(bar) bar.style.width = '100%';
      });
    $('[data-ok]').onclick = () => finish('soft');
    $('[data-x]').onclick = () => finish(null);
    btn.onclick = () => finish('purge');
  });
}

      <div class="traffic-pill" id="traffic-pill" title="${esc(t('statTraffic'))}">
        <span class="bar"><i id="pill-bar" style="width:0%"></i></span>
        <span id="pill-text">— / —</span>
      </div>
      <div class="colctl" id="colctl">
        <button id="col-minus" title="${esc(t('colsLabel'))} −1" aria-label="减少列数">−</button>
        <div class="lbl" id="col-lbl" title="${esc(t('colsAutoBack'))}">${esc(t('colsLabel'))}<b id="col-num">1</b></div>
        <button id="col-plus" title="${esc(t('colsLabel'))} +1" aria-label="增加列数">+</button>
      </div>
      <button class="btn sm" id="theme-toggle" title="🌙 / ☀️" style="font-size:16px;padding:9px 11px;line-height:1">${document.documentElement.dataset.theme === 'light' ? '🌙' : '☀️'}</button>
      <button class="btn sm" id="lang-btn">${esc(t('switchTo'))}</button>

    </div>

      <nav class="sidebar" id="sidebar">${sidebarHtml}</nav>
      <div id="view"></div>
    </div>
  </div>`;

  // 侧边栏折叠开关：状态写进 localStorage，刷新/重进后保持。
  // ⚠️ localStorage 必须整个包在 try/catch 里：Safari 隐私模式、存储被策略禁用、
  //    以及 file:// 源下访问它都会抛 SecurityError。一旦这里抛出且没兜住，
  //    异常会冒泡到启动逻辑的 catch，进而把整个后台换成登录页 —— 页面看起来"登录不了"。
  {
    const appEl = $('#app');
    let saved = '0';
    try { saved = localStorage.getItem('sbCollapsed') || '0'; } catch (e) { /* 存储不可用，忽略 */ }
    if (saved === '1') appEl.classList.add('sb-collapsed');
    $('#sb-toggle').onclick = () => {
      appEl.classList.toggle('sb-collapsed');
      const next = appEl.classList.contains('sb-collapsed') ? '1' : '0';
      try { localStorage.setItem('sbCollapsed', next); } catch (e) { /* 存不下也不影响本次折叠 */ }
    };
  }

  // 顶栏「列数」调节：读回上次的手动偏置并绑定 − / 列数 / +
  loadColBias();
  bindColCtl();

  // 绑定侧边栏事件
  $('#sidebar').addEventListener('click', e => {
    const main = e.target.closest('.sb-main');
    if (main) {
      const gKey = main.dataset.group;
      const tab = main.dataset.tab;
      if (tab) {
        // 普通用户不得进入仅管理员可见的分组（前端第一道；服务端为准）
        const grp = NAV_GROUPS.find(g => g.key === TAB_TO_GROUP[tab]);
        if (grp && grp.adminOnly && !IS_ADMIN) {
          toast(LANG === 'zh' ? '无权限访问该分组' : 'No permission for this section', 'err');
          return;
        }
        // 叶子节点（如 overview）：直接切换
        switchTab(tab);
      } else {
        // 有子菜单的：切换展开/收起
        const sub = $('#sidebar .sb-sub[data-sub="' + gKey + '"]');
        main.classList.toggle('open');
        sub?.classList.toggle('open');
        openGroup = main.classList.contains('open') ? gKey : null;
      }
      return;
    }
    const subBtn = e.target.closest('.sb-sub button[data-tab]');
    if (subBtn) switchTab(subBtn.dataset.tab);
  });

  // ⚠️ 退出后直接回 /login 登录页，不要再用本 SPA 内置的登录卡片：
  //    内置卡片只有"用户名 + 密码"，没有 GitHub / OAuth 按钮 —— 之前表现为
  //    "登出之后 GitHub 登录按钮就没了"。/login 才是带 OAuth 按钮的完整登录页。
  $('#logout-btn').onclick = async () => {
    await api('/api/admin/logout', {method:'POST'}).catch(()=>{});
    location.replace('/login');
  };
  $('#traffic-pill').onclick = () => switchTab('settings');
  $('#lang-btn').onclick = toggleLang;
  $('#theme-toggle').onclick = async () => {
    // Apple 主题下（隐藏路由）不允许切换
    const currentTheme = document.documentElement.dataset.theme;
    if (currentTheme === 'apple' || currentTheme === 'apple-dark') return;
    const next = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    $('#theme-toggle').textContent = next === 'light' ? '🌙' : '☀️';
    try { await api('/api/admin/settings', { method:'PUT', body: JSON.stringify({ ui_theme: next }) }); } catch {}
  };
  switchTab('overview');
}

/* Tab → loadXxx 函数映射 */
const TAB_LOADERS = {
  overview: loadOverview, files: loadFiles, trash: loadTrash, storage: loadStorage, shares: loadShares,
  direct: loadDirectLinks, logs: loadLogs, bans: loadBans,
  global: loadGlobal, codes: loadCodes, security: loadSecurity, webdav: loadWebDAV, settings: loadSettings,
};

// ⚠️ opts.skipLoad：调用方自己会去加载数据时必须传 true。
//    switchTab 内部会隐式跑一次 TAB_LOADERS[tab]()，与调用方的加载**并发**；
//    谁后返回谁覆盖状态（gotoFileRecord 从"存储浏览"跳过来时被隐式那次
//    打回根目录，目标文件找不到、高亮也没了 —— 线上实测复现过）。
function switchTab(tab, opts){
  currentTab = tab;
  openGroup = TAB_TO_GROUP[tab] || tab;
  // 更新侧边栏高亮 & 展开
  const sidebar = $('#sidebar');
  if (sidebar) {
    sidebar.querySelectorAll('.sb-main').forEach(m => {
      const gKey = m.dataset.group;
      const g = NAV_GROUPS.find(g => g.key === gKey);
      const isSingle = !g.subs;
      const isActive = (isSingle && g.tab === tab) || TAB_TO_GROUP[tab] === gKey;
      m.classList.toggle('open', isActive);
      m.classList.toggle('active', isActive && isSingle);
      const sub = sidebar.querySelector('.sb-sub[data-sub="' + gKey + '"]');
      if (sub) sub.classList.toggle('open', isActive);
    });
    sidebar.querySelectorAll('.sb-sub button[data-tab]').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === tab)
    );
  }
  const v = $('#view');
  v.innerHTML = '<div class="spin"></div>';
  // 先按新页签算列数（--ui-cols / 顶栏数字 / ± 可用状态），再让 loader 渲染
  syncCols();
  if (opts && opts.skipLoad) return;
  (TAB_LOADERS[tab] || (() => Promise.resolve()))()
    .then(() => reflowCurrentTab(false))   // 渲染完成后统一分列：卡片页 flowColumns、表格页 splitListTables
    .catch(e => {
      v.innerHTML = `<div class="glass section"><div class="empty"><div class="icon">⚠️</div>${esc(e.message === 'unauthorized' ? t('loadingErr') : e.message)}</div></div>`;
    });
}

/* ═══════════ 容量卡片（概览）═══════════
   饼图用内联 SVG 手画：项目本身零依赖，不值得为一个饼图引入图表库。
   配色固定顺序 —— 否则同一分类在不同时间会换颜色，用户会以为数据变了。 */
const PIE_COLORS = ['#0a84ff', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#22d3ee', '#fb923c', '#94a3b8'];
const TYPE_LABEL_KEY = {
  image: 'typeImage', video: 'typeVideo', audio: 'typeAudio', doc: 'typeDoc',
  archive: 'typeArchive', code: 'typeCode', other: 'typeOther',
};

/** 生成饼图。只有一个分类时画整圆（单点 path 画不出圆）。 */
function pieSvg(items, size = 132){
  const total = items.reduce((a, x) => a + x.bytes, 0);
  if(total <= 0) return '';
  const cx = size / 2, cy = size / 2, r = size / 2 - 1;
  let a0 = -Math.PI / 2;                        // 从 12 点开始，顺时针
  const paths = items.map((it, i) => {
    const frac = it.bytes / total;
    let d;
    if(items.length === 1 || frac > 0.9999){
      d = `M ${cx} ${cy} m -${r} 0 a ${r} ${r} 0 1 0 ${2 * r} 0 a ${r} ${r} 0 1 0 -${2 * r} 0`;
    } else {
      const a1 = a0 + frac * Math.PI * 2;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      d = `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
      a0 = a1;
    }
    return `<path d="${d}" fill="${PIE_COLORS[i % PIE_COLORS.length]}"><title>${esc(it.label)}: ${fmtSize(it.bytes)}</title></path>`;
  }).join('');
  return `<svg class="pie" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">${paths}</svg>`;
}

function pieLegend(items){
  const total = items.reduce((a, x) => a + x.bytes, 0) || 1;
  return `<div class="legend">${items.map((it, i) => `
    <div class="lg-row"><i style="background:${PIE_COLORS[i % PIE_COLORS.length]}"></i>
      <span class="lg-n" title="${esc(it.label)}">${esc(it.label)}</span>
      <span class="lg-v">${fmtSize(it.bytes)} · ${Math.round(it.bytes / total * 100)}%</span></div>`).join('')}</div>`;
}

function capSection(u){
  // 分母用**存储硬上限**（十进制口径，与 Cloudflare 免费额度对齐），
  // 不再用旧的那套 GiB 口径 —— 9.95 GiB = 10.68 GB，本身就超了免费额度。
  const used = u.used_bytes || 0;
  const quota = u.cap_bytes || u.quota_bytes || 0;
  const real = u.real_bytes || 0;
  const pct = quota > 0 ? Math.min(100, used / quota * 100) : 0;
  const rpct = (u.cf_free_bytes || 0) > 0 ? Math.min(100, real / u.cf_free_bytes * 100) : 0;
  const byUser = (u.by_owner || []).map(x => ({ label: x.key, bytes: x.bytes }));
  const byType = (u.by_type || []).map(x => ({
    label: TYPE_LABEL_KEY[x.key] ? t(TYPE_LABEL_KEY[x.key]) : x.key,
    bytes: x.bytes,
  }));
  const box = (title, items) => `
    <div class="cap-box"><h3>${title}</h3>
      ${items.length ? `<div class="cap-pie">${pieSvg(items)}${pieLegend(items)}</div>`
                     : `<div class="empty" style="padding:18px">${esc(t('noData'))}</div>`}
    </div>`;
  return `
  <div class="glass section">
    <div class="section-title">
      <h2>💾 ${esc(t('capTitle'))}</h2>
      <div style="font-size:12.5px;color:var(--text-3)">
        ${esc(t('capUsedOf', { used: fmtSize(used), quota: fmtSize(quota) }))}
        · ${esc(t('capFilesN', { n: u.file_count }))}${u.trash_count ? ' · ' + esc(t('capTrashN', { size: fmtSize(u.trash_bytes), n: u.trash_count })) : ''}
      </div>
    </div>
    <div class="cap-bar ${pct >= 90 ? 'warn' : ''}"><i style="width:${pct.toFixed(2)}%"></i></div>
    <div style="margin-top:6px;font-size:12.5px;color:var(--text-3);line-height:1.7">
      ☁️ Cloudflare 实测桶内 <b style="color:${rpct >= 95 ? 'var(--danger)' : 'var(--text-2)'}">${fmtSize(real)}</b>
      / ${fmtSize(u.cf_free_bytes || 0)}（10 GB 免费额度，${rpct.toFixed(1)}%）
      · 回收站另占 ${fmtSize(u.trash_bytes || 0)}<br>
      硬上限 ${fmtSize(quota)}：上传前会先自动清空回收站（按删除时间从旧到新彻底删除）来腾位置，
      实在腾不出就拒绝上传 —— 保证永远不会超过免费额度产生费用
      ${u.real_at ? ' · 校准于 ' + new Date(u.real_at).toLocaleString() : ' · 校准中…'}
    </div>
    <div class="cap-grid">
      ${box('👤 ' + esc(t('capByUser')), byUser)}
      ${box('🗂️ ' + esc(t('capByType')), byType)}
    </div>
  </div>`;
}

/* ═══════════ 文件管理器状态 ═══════════
   FM.data 直接就是 /api/admin/dirs 的返回（含 dirs / files / breadcrumb / writable）。 */
const FM = { path: null, view: 'details', thumb: 150, data: null, start: null, sel: new Set() };
/** 系统保留目录名（与服务端 vfs.ts 的常量保持一致） */
const RECYCLE_DIR_NAME = 'Recycle_Bin';
/** 缩略图尺寸滑杆的范围（HTML 与 JS 共用，改一处即可） */
const THUMB_MIN = 80, THUMB_MAX = 320;

/* ════════════════════════════════════════════════════════════════
 * 缩略图小图缓存
 * 为什么要有这一整套：以前缩略图模式是 <img src="/api/admin/files/:id/raw">，
 * 也就是为了在 80~320px 的**方块**里显示中心一小块，而把整张原图
 * （常见 4000×3000、甚至 6000×4000 的几 MB 大图）下载 + 全图解码；
 * CSS 的 object-fit:cover 又只显示居中那一块 —— 流量和解码内存全花在看不见的地方。
 * 一屏几十张就把标签页卡死，拖动滑杆重排时更是直接假死。
 *
 * 现在的做法（两阶段）：
 *   1) 优先读 /api/admin/thumbs/{id}?w=… —— 一张几十 KB 的正方形小图，
 *      解码只有目标档位的像素量（默认档位 384² ≈ 15 万像素 vs 原图 1200 万像素）；
 *      手里有**够清晰**的那档就直接用它，不去碰原图。
 *   2) 小图还没有 ⇒ 回落读原图，但**只在视口附近**才挂 src（远处留空占位），
 *      图一解码完就用 canvas 裁一张"中心正方形 + 当前档位"的 JPEG 回传给后端存好，
 *      成功后把这个 <img> 换成小图（顺手释放大图的解码内存），
 *      并记进 THUMB_HAVE，以后就算重开目录也直接走小图。
 *   3) 滑杆拉大 / 列数变少 ⇒ **停稳 1s**（THUMB_SETTLE_MS）后补一趟升档（queueThumbUpgrade + scheduleThumbUpgrade）：
 *      旧档位的小图只能被浏览器拉伸，拉到最大就是一片糊，所以必须重新按新档位裁一张。
 *      还在显示原图的那些直接用内存里的原图重裁（零额外流量）；
 *      已经换成小图的重新取一次原图再裁（原图有 1 小时 HTTP 缓存，多数是缓存命中）。
 * ════════════════════════════════════════════════════════════════ */
/** 小图宽度档位（与后端 admin.ts 的 THUMB_WIDTHS 一致，改一处要两处一起改） */
const THUMB_W = [128, 192, 256, 384, 512, 768];
/** 回传小图的体积上限（768² q72 一般 ≤120KB，512KB 足够宽松） */
const THUMB_MAX_UPLOAD = 512 * 1024;
/**
 * 滑杆 / 列数停稳多久才动"升档"这一趟（毫秒）。
 * 手一松开就数满 1s —— 太早动会在用户还在来回微调时白下一次原图，太晚又变迟钝。
 */
const THUMB_SETTLE_MS = 1000;
/**
 * 会话内已确认"缓存小图存在"的文件 id → 已经生成过的档位列表（升序）。
 * 存**列表**而不是单个值是有原因的：滑杆拖小再拖大时能直接命中那张旧档位的小图，
 * 不必再下一遍原图重裁；反过来"档位不够"也能一眼看出来，触发升档（见 queueThumbUpgrade）。
 */
const THUMB_HAVE = new Map();
function thumbMark(id, w){
  const a = THUMB_HAVE.get(id) || [];
  if(a.indexOf(w) < 0) THUMB_HAVE.set(id, a.concat(w));
}
/** "看得见"判定（视口 ±600px）：升档只管这一圈的图，远处重裁纯属白烧流量 */
function thumbNear(im){
  const r = im.getBoundingClientRect();
  return r.bottom > -600 && r.top < (window.innerHeight + 600);
}
const THUMB_PENDING = new Set();
let thumbIO = null, thumbQ = [], thumbBusy = false, thumbTimer = null, thumbUpgradeT = null;

/** 小图档位：方框最大 320 CSS px（滑杆上限），2× 屏要 640 设备像素 → 取最接近的档位 */
function thumbNeed(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);   // 3× 屏也只按 2× 生成：肉眼看不出差别，省一半流量
  const box = Math.max(THUMB_MIN, Math.min(THUMB_MAX, FM.thumb || 150));
  const want = box * dpr;
  for(const w of THUMB_W) if(w >= want) return w;
  return THUMB_W[THUMB_W.length - 1];
}
const thumbUrl = (id, w) => `/api/admin/thumbs/${encodeURIComponent(id)}?w=${w}`;
const rawUrl = id => `/api/admin/files/${encodeURIComponent(id)}/raw`;

/** 只给"视口附近"的图挂 src —— 远处保持空占位，避免一屏几十张大图同时解码。
 *  Plan A（缩略图优先）：新鲜加载一律先读 R2 里已经生成好的缩略图（几十 KB 的小图），
 *  只有在该图还没生成过缩略图（GET 返回 404）时才回落读原图，原图解码完再由 genThumb
 *  顺手裁一张当前档位的小图回传存好。这样即使刷新页面 / 换目录，已经生成过缩略图的图
 *  也永远走小图，不再反复拉几 MB 原图（之前 THUMB_HAVE 只在内存里、刷新即丢，等于每次
 *  都重新拉原图 —— 这正是"大量图片文件夹打开很慢"的根因）。 */
function mountThumbs(){
  const imgs = $$('#fm-list img.timg');
  if(!imgs.length) return;
  if(!thumbIO){
    thumbIO = new IntersectionObserver(es => {
      const want = thumbNeed();
      for(const en of es){
        if(!en.isIntersecting) continue;
        thumbIO.unobserve(en.target);
        if(en.target.dataset.mounted) continue;
        en.target.dataset.mounted = '1';
        const id = en.target.dataset.thumb;
        // 先挂当前档位的缩略图：R2 里已有 7057 张，绝大多数图片直接命中小图；
        // 加载失败（多半是这张图还没生成过缩略图）→ 回落原图，原图解码后由 genThumb
        // 补生成，下次再进这个目录就直接走小图。回落只做一次，杜绝 onerror 死循环。
        en.target.dataset.mode = 'thumb';
        en.target.dataset.vw = '0';
        en.target.dataset.w = want;
        en.target.onerror = () => {
          if(en.target.dataset.mode !== 'thumb') return;   // 已经回落过原图，不再处理
          en.target.dataset.mode = 'raw';
          en.target.onerror = null;
          en.target.src = rawUrl(id);
        };
        en.target.src = thumbUrl(id, want);
      }
    }, { rootMargin: '700px 0px' });
    // load 事件不冒泡，只能挂在捕获阶段（整个页面只挂这一次）
    document.addEventListener('load', e => {
      const im = e.target;
      if(!im || !im.classList || !im.classList.contains('timg')) return;
      if(im.dataset.mode === 'thumb'){
        // 缩略图加载成功：记下档位并标记"已生成"，避免后续升档 / 重挂时重复生成同一张
        const w = +im.dataset.w || 0;
        im.dataset.vw = String(w);
        if(w) thumbMark(im.dataset.thumb, w);
        return;
      }
      // mode === 'raw'：原图加载成功（本就无缩略图，或缩略图 404 回落）。
      // 既然原图都解码了，顺手裁一张当前档位的小图回传存好，下次直接走小图。
      if(im.dataset.vw && im.dataset.vw === im.dataset.w) return;
      queueThumbGen(im);
    }, true);
  }
  for(const im of imgs){ if(!im.dataset.mounted) thumbIO.observe(im); }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
/** canvas / fetch 万一不回调也不能把整条队列卡死 —— 超时就按 fallback 处理 */
const withTimeout = (p, ms, fallback) => Promise.race([Promise.resolve(p), sleep(ms).then(() => fallback)]);

/** 原图解码完了：排队生成小图（一次只做一张，且等页面闲下来再做）。
 *  ⚠️ 这里**不挑 mode**——已经显示旧小图的（dataset.mode === 'thumb'）也要能排队升档，
 *     那正是"滑杆拉大之后发糊"的根因所在（旧小图只能被浏览器拉伸缩放）。 */
function queueThumbGen(im, want){
  const id = im.dataset.thumb;
  if(!id || THUMB_PENDING.has(id)) return;
  const w = want || +im.dataset.w || thumbNeed();
  // 还显示着原图时，原图本身就比目标小（比如 800×600 的图裁成 192 就够了），生成了也白费流量
  if(im.dataset.mode === 'raw' && (!im.naturalWidth || im.naturalWidth <= w)) return;
  THUMB_PENDING.add(id);
  im.dataset.w = w;                    // 目标档位改了，后面 genThumb 直接按新档位裁
  thumbQ.push(im);
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(drainThumbGen, 700);
}

/**
 * 补一趟"升档"扫描：滑杆被拖大 / 列数变少之后，屏幕上显示的小图还是**旧档位**
 * （比如先按 150 生成了 192，拖到 320 就要 384，直接拉伸就会发虚）。
 * 两条纪律：
 *   1) 只扫**视口附近**的图 —— 远处重裁了也看不见，纯烧流量；
 *   2) 只升不降 —— 缩小的那档浏览器本来就会降采样，看着不糊。
 */
function queueThumbUpgrade(seen){
  const want = thumbNeed();
  const done = seen || new Set();
  for(const im of $$('#fm-list img.timg')){
    const id = im.dataset.thumb;
    if(!id || done.has(id)) continue;
    const cur = +im.dataset.vw || 0;
    if(cur >= want) continue;                                          // 已经够清晰
    if(!thumbNear(im)) continue;                                       // 看不见的不管
    if(im.dataset.mode === 'raw' && im.naturalWidth && im.naturalWidth <= want) continue;
    done.add(id);
    queueThumbGen(im, want);
  }
}

/**
 * 滑杆 / 列数一变，就排一趟"**停稳后**升档"。
 * 为什么必须抖（THUMB_SETTLE_MS = 1000ms，即滑杆停手满 1s 才动手）：
 * 拖动过程中每一帧都在重建整列表（renderFileList 是 60ms 节流），
 * 边拖边下原图重裁会把页面拖死；手一停住再动手，用户看到的才是"拉大 → 停手 1s → 变清晰"。
 * 取 1s 而不是更短的抖动值，是为了躲开"用户还在微调、马上还要再拖一下"的中间态：
 * 拖到最大往往要来回拉几段，抖太短会在第一段落点上就开工，下一秒又被自己作废，
 * 白白重下一次几 MB 的原图。每次 scheduleThumbUpgrade 都会清掉上一颗定时器，
 * 所以只有**最后一次停手**满 1s 才真正升档。
 */
function scheduleThumbUpgrade(){
  clearTimeout(thumbUpgradeT);
  thumbUpgradeT = setTimeout(() => {
    thumbUpgradeT = null;
    queueThumbUpgrade(new Set());
    drainThumbGen();
  }, THUMB_SETTLE_MS);
}

async function drainThumbGen(){
  if(thumbBusy){                       // 上一轮还没干完：重新排一次，别让这批图永远没人管
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(drainThumbGen, 900);
    return;
  }
  thumbBusy = true;
  try{
    // 最多转 4 圈：每圈先补一趟升档扫描，再把排到的做掉（滑杆连续拖动时可能连着要升档）
    const done = new Set();
    let rounds = 0;
    while(rounds++ < 4){
      queueThumbUpgrade(done);
      if(!thumbQ.length) break;
      const im = thumbQ.shift();
      try{ await withTimeout(genThumb(im), 30000, null); }catch(e){}
      // 做完了（含超时/失败）才把这个 id 从"进行中"里摘掉：失败的那张下次还有机会重试
      try{ THUMB_PENDING.delete(im.dataset.thumb); }catch(e){}
      await sleep(0);                  // 让出主线程，别把滚动/拖滑杆卡住
    }
  }finally{
    thumbBusy = false;
    // 自愈：收工时队列里还压着任务（典型是最后一张大图"下载完"才入队，这轮已经扫过了），
    // 一次性 setTimeout 容易接不上，任务就永远停在原图上了。这里再排一轮兜底。
    // 注意不能直接判 !thumbTimer 就跳过：那个 id 可能是**已经触发过**的陈旧值，
    // 判出来 false 反而不排 —— 任务照样卡住。统一 clear 掉再排。
    if(thumbQ.length){
      clearTimeout(thumbTimer);
      thumbTimer = setTimeout(() => { thumbTimer = null; drainThumbGen(); }, 500);
    }
  }
}

/** 重新拉一遍原图并解码成 ImageBitmap —— 只给"升档"用（旧小图没法放大出清晰版）。
 *  原图响应带 max-age=3600，同一会话里重开基本都是浏览器缓存命中，不是真走网络。 */
async function fetchRawBitmap(id){
  try{
    const res = await withTimeout(fetch(rawUrl(id), {
      credentials: 'same-origin', cache: 'force-cache',
    }), 30000, null);
    if(!res || !res.ok) return null;
    const blob = await res.blob();
    return await withTimeout(createImageBitmap(blob), 20000, null);
  }catch(e){ return null; }
}

/** 裁一张"目标档位"的小图回传存进存储；显示中的 <img> 最后换成这张小图。
 *  ⚠️ mode === 'raw'：屏幕上的原图就是现成采样源，直接裁 ⇒ 零额外流量。
 *  ⚠️ mode === 'thumb'：说明这张图**已经换成过小图**了（旧档位），只能重新取原图
 *     再裁一遍。不做这一步，滑杆拉大时用户看到的就是被拉伸的糊图。 */
async function genThumb(im){
  const id = im.dataset.thumb, w = +im.dataset.w;
  if(!id || !w || !im.naturalWidth) return;
  let src = im, bmp = null, nw = im.naturalWidth, nh = im.naturalHeight;
  if(im.dataset.mode !== 'raw'){
    bmp = await fetchRawBitmap(id);
    if(!bmp) return;
    src = bmp; nw = bmp.width; nh = bmp.height;
  }
  try{
    const blob = await withTimeout(thumbBlob(src, nw, nh, w), 15000, null);
    if(!blob || blob.size > THUMB_MAX_UPLOAD) return;
    const ok = await withTimeout(fetch(thumbUrl(id, w), {
      method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: blob, credentials: 'same-origin',
    }).then(res => res.ok).catch(() => false), 20000, false);
    if(!ok) return;
    thumbMark(id, w);
    im.dataset.mode = 'thumb';       // 先改标记再换 src：换 src 后 img 里就只剩这张小图了
    im.dataset.vw = w;
    im.src = thumbUrl(id, w);   // 换成小图：省内存，也让"当前这屏"以后都走小图
  }finally{
    if(bmp && bmp.close) bmp.close();
  }
}

/** canvas 裁"中心正方形"（与 CSS object-fit:cover 的取景完全一致）+ 缩到目标分辨率 */
async function thumbBlob(src, nw, nh, w){
  const s = Math.min(nw, nh);
  const sx = (nw - s) / 2, sy = (nh - s) / 2;
  // 路径一：原生"裁一块 + 直接缩到目标"，浏览器内部走最优采样（比一步 drawImage 快一个量级）
  try{
    const bmp = await createImageBitmap(src, sx, sy, s, s, {
      resizeWidth: w, resizeHeight: w, resizeQuality: 'high',
    });
    const c = document.createElement('canvas');
    c.width = c.height = w;
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, 0, 0);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
    if(blob) return blob;
  }catch(e){ /* 老浏览器不支持 resize 选项 → 走路径二 */ }

  // 路径二：两步缩。10000px 一步缩到 384 很慢，先降到 ≤1536 再落到目标（经典渐进降采样）
  try{
    const mid = Math.min(1536, Math.max(w * 2, 256));
    const c1 = document.createElement('canvas');
    c1.width = c1.height = mid;
    const g1 = c1.getContext('2d');
    g1.imageSmoothingEnabled = true; g1.imageSmoothingQuality = 'high';
    g1.drawImage(src, sx, sy, s, s, 0, 0, mid, mid);
    const c = document.createElement('canvas');
    c.width = c.height = w;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(c1, 0, 0, mid, mid, 0, 0, w, w);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
  }catch(e){ return null; }
}

/** 上传时装好小图：新传的大图第一次浏览也会卡，先在这儿顺手裁一张存起来 */
async function genThumbOnUpload(id, file){
  if(!id || !file || file.size < 96 * 1024) return;
  const w = thumbNeed();
  try{
    const bmp = await createImageBitmap(file);
    const blob = await thumbBlob(bmp, bmp.width, bmp.height, w);
    if(bmp.close) bmp.close();
    if(!blob || blob.size > THUMB_MAX_UPLOAD) return;
    const r = await fetch(thumbUrl(id, w), {
      method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: blob, credentials: 'same-origin',
    });
    if(r.ok) thumbMark(id, w);
  }catch(e){ /* 生成失败不影响上传与浏览，下次浏览会再试一次 */ }
}

function fmLoadPrefs(){
  try{
    const v = localStorage.getItem('fmView');
    if(v === 'thumbs' || v === 'details') FM.view = v;
    const th = parseInt(localStorage.getItem('fmThumb') || '', 10);
    if(th >= 80 && th <= 320) FM.thumb = th;
  }catch(e){ /* 存储不可用（隐私模式 / file://）时用默认值即可 */ }
}
function fmSavePrefs(){
  try{ localStorage.setItem('fmView', FM.view); localStorage.setItem('fmThumb', String(FM.thumb)); }catch(e){}
}

/* ═══════════ 列排序（Windows 资源管理器风格）═══════════
   点表头 → 按这一列排；再点同一列 → 反向；点别的列 → 换列并用该列默认方向
   （数值/时间列默认降序：先看到最大/最新，符合直觉；名称列默认升序）。

   约定：
   · 空值（— / 这列没数据）恒排最后，升降序都一样 —— 否则一堆空行插在正中间最碍眼；
   · **文本列一律忽略大小写**（sensitivity:'base'）：Apple / apple / APPLE 视为同字母、排在一起；
     真正相等时再用区分大小写做 tie-break，保证顺序确定（详见 sortRows 里的注释）；
   · 状态按列表（files / trash / storage）各自存 localStorage，换页签、刷新都还在；
   · 表头只须写 <th class="sortable" data-sortlist="files" data-sort="size">，
     点击由下面**一个**全局监听器兜住，以后新增列表只要往 SORT_FMT 里加即可。 */
const numOf  = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const timeOf = v => { const d = v ? new Date(v).getTime() : NaN; return Number.isFinite(d) ? d : 0; };
const isBlank = v => v == null || v === '' || v === DASH;

/** 每列怎么取值（返回**可比较**的值：文本列给字符串，数值/时间列给数字；desc 表示默认降序） */
const SORT_FMT = {
  /* 文件页：目录与文件混排，目录永远在前（见 renderFileList） */
  files: {
    name:     { get: r => String(r.name ?? '') },
    size:     { get: r => numOf(r.size), desc: 1 },
    mtime:    { get: r => timeOf(r.mtime || r.uploaded_at), desc: 1 },
    res:      { get: r => numOf(r.width) * 1e5 + numOf(r.height), desc: 1 },   // 先比宽、同宽比高
    duration: { get: r => numOf(r.duration_ms), desc: 1 },
    fps:      { get: r => numOf(r.fps), desc: 1 },
    vbr:      { get: r => numOf(r.v_bitrate), desc: 1 },
    abr:      { get: r => numOf(r.a_bitrate), desc: 1 },
  },
  /* 回收站 */
  trash: {
    name:   { get: r => String(r.name ?? '') },
    origin: { get: r => String(r.original_path || '') },
    size:   { get: r => numOf(r.size), desc: 1 },
    by:     { get: r => String(r.deleted_by || '') },
    at:     { get: r => timeOf(r.deleted_at), desc: 1 },
    left:   { get: r => r.days_left == null ? null : numOf(r.days_left) },
  },
  /* 存储浏览（目录仍永远在最前，见下面 storage 的 sortRows 调用） */
  storage: {
    name:  { get: r => String(r.name ?? '') },
    size:  { get: r => numOf(r.size), desc: 1 },
    time:  { get: r => timeOf(r.uploaded_at || r.lastModified), desc: 1 },
    owner: { get: r => String(r.owner || '') },
    loc:   { get: r => String(r.path || '') },
  },
};
const SORT_DEFAULT = {
  files:   { key: 'name', dir: 'asc' },
  trash:   { key: 'at',   dir: 'desc' },
  storage: { key: 'name', dir: 'asc' },
};
const SORT_STATE = {};        // 列表名 → { key, dir }（内存 + localStorage）
const SORT_RERENDER = {};     // 列表名 → 排序完怎么重画（各列表渲染时登记）
const SORT_ROWS = {};         // 列表名 → 已经存好 html 的行数组（只重排、不重新请求）
const SORT_LABEL = {};        // 列表名 → { 列key: 表头里显示的标题 }（缩略图模式没表头，靠它显示当前排的是哪一列）

function sortLoad(name){
  try{
    const v = JSON.parse(localStorage.getItem('fmSort_' + name) || '');
    if(v && SORT_FMT[name] && SORT_FMT[name][v.key])
      SORT_STATE[name] = { key: v.key, dir: v.dir === 'desc' ? 'desc' : 'asc' };
    else SORT_STATE[name] = Object.assign({}, SORT_DEFAULT[name]);
  }catch(e){ SORT_STATE[name] = Object.assign({}, SORT_DEFAULT[name]); }
}
function sortSave(name){
  try{ localStorage.setItem('fmSort_' + name, JSON.stringify(SORT_STATE[name])); }catch(e){}
}
/** 按当前列/方向排一份副本（不动原数组） */
function sortRows(name, rows){
  const st = SORT_STATE[name], f = (SORT_FMT[name] || {})[st.key];
  if(!f || !rows || rows.length < 2) return rows || [];
  const dir = st.dir === 'desc' ? -1 : 1;
  return rows.slice().sort((a, b) => {
    const x = f.get(a), y = f.get(b);
    const bx = isBlank(x), by = isBlank(y);
    if(bx && by) return 0;
    if(bx) return 1;                     // 空值沉底，不受升降序影响
    if(by) return -1;
    // 主比较（三条一起看，缺一都会翻车）：
    //   · sensitivity:'base'   = **忽略大小写**（Apple / apple / APPLE 一律判相等）；
    //   · numeric:true         = 文件名里的数字按数值比（IMG2 < IMG10）；
    //   · ignorePunctuation    = **把 - _ . 空格 当不存在**（Windows 资源管理器也是这么排的）。
    //     少了这一条，COSH-001.jpg 与 cosh002_001.jpg 会在第 4 个字符上比 '-' vs '0'，
    //     于是 412 个大写 COSH-* 全跑完后才轮到小写 cosh*，看起来像"小写没排上来"。
    //     加上它之后两者比的是数字 001 vs 002，小写自然就串进数字序里（实测 cosh002_001.jpg
    //     从索引 740 提到 336，紧挨 COSH-001.jpg）。zh-Hans-CN 让中文按拼音。
    const c = (typeof x === 'number' && typeof y === 'number')
      ? x - y
      : String(x).localeCompare(String(y), 'zh-Hans-CN',
          { numeric: true, sensitivity: 'base', ignorePunctuation: true });
    if(c) return c * dir;
    /* ⚠️ 关键：主比较相等时**不能**直接 return 0。
       返回 0 的话 sort 退化成"稳定排序"，同字母的几行会照搬后端返回的先后，
       结果就是每个字母组里都是"大写在前、小写在后"（用户看到"所有小写都排在大写后面"）。
       ⇒ 再补一发**区分大小写**的原生比较做确定性 tie-break：
       ICU 的原生序是小写在前（'a' < 'A'），于是同字母必然紧挨在一起且顺序稳定可预期。 */
    if(typeof x === 'number' || typeof y === 'number') return 0;
    return String(x).localeCompare(String(y), 'zh-Hans-CN', { numeric: true }) * dir;
  });
}
/** 可点击排序的表头单元格（整格可点，Tab 能聚焦、Enter/空格也能切） */
function sortTh(name, key, label, width){
  const st = SORT_STATE[name], on = st.key === key;
  (SORT_LABEL[name] = SORT_LABEL[name] || {})[key] = label;   // 记下来给缩略图模式的"当前排序"按钮用
  const tip = on ? (st.dir === 'asc' ? '升序 ▲｜点击改为降序' : '降序 ▼｜点击改为升序') : '点击按此列排序';
  return `<th class="sortable${on ? ' sorted' : ''}" data-sortlist="${name}" data-sort="${key}"
    tabindex="0" style="width:${width}" title="${esc(label + '｜' + tip)}"><span>${esc(label)}</span>${
      on ? `<i class="ar">${st.dir === 'asc' ? '▲' : '▼'}</i>` : ''}</th>`;
}
/** 把当前状态刷到页面上所有表头（列表重画之后调用，保证箭头和状态一致） */
function syncSortArrows(){
  $$('th.sortable[data-sortlist]').forEach(th => {
    const st = SORT_STATE[th.dataset.sortlist], on = st && st.key === th.dataset.sort;
    th.classList.toggle('sorted', !!on);
    let ar = th.querySelector('.ar');
    if(on){
      if(!ar){ ar = document.createElement('i'); ar.className = 'ar'; th.appendChild(ar); }
      ar.textContent = st.dir === 'asc' ? '▲' : '▼';
    }else if(ar){ ar.remove(); }
  });
}
/** 缩略图模式没有表头可点，用这个按钮把"当前按什么排"显示出来，
 *  点它就是切回详细信息视图（到那边点表头才改得了排序）。 */
function fmSortNote(){
  const st = SORT_STATE.files, lb = (SORT_LABEL.files || {})[st.key] || t('colName');
  return `<button class="btn sm" id="fm-sort-note" title="${esc(lb + '（点击切回详细信息改排序）')}">⇅ ${esc(lb)} ${st.dir === 'asc' ? '↑' : '↓'}</button>`;
}
function applySort(th){
  const name = th.dataset.sortlist, key = th.dataset.sort, map = SORT_FMT[name];
  if(!map || !map[key]) return;
  const st = SORT_STATE[name];
  if(st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
  else { st.key = key; st.dir = map[key].desc ? 'desc' : 'asc'; }
  sortSave(name);
  syncSortArrows();

}
// ⚠️ 一个监听器兜住所有列表：以后新增可排序列/列表都不用再写绑定
document.addEventListener('click', e => {

document.addEventListener('keydown', e => {

/* ── 全局快捷键 ────────────────────────────────────────
   Esc  = 退一层：开着预览先关预览；否则清掉选中（顶掉"取消选择"按钮）；再否则去掉光标。
   空格/Enter = 打开光标所在那张图；预览开着时它们改成"关闭预览"。
   ⚠️ 输入框里、表头排序、以及任何弹窗开着的时候都不抢键。 */
document.addEventListener('keydown', e => {
  const el = e.target;
  const tn = (el && el.tagName || '').toLowerCase();
  if(tn === 'input' || tn === 'textarea' || tn === 'select' || (el && el.isContentEditable)) return;
  if(el && el.closest && el.closest('th.sortable')) return;
  if(document.getElementById('modal')) return;
  if(e.key === 'Escape'){
    e.preventDefault();
    if(LB && LB.open){ lbClose(); return; }
    if(FM.sel.size){ FM.sel.clear(); syncChecks(); renderSelBar(); curClear(); return; }
    if(CUR.fid) curClear();
    return;
  }
  if(e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  if(LB && LB.open){ lbClose(); return; }
  if(!CUR.fid) return;
  const p = curCanPreview();
  if(p) openPreview(p.id, CUR.list);
  else if(PIX[CUR.list || 'files'] && PIX[CUR.list][CUR.fid])
    toast(LANG === 'zh' ? '只能预览图片文件（视频请用播放器打开）' : 'Only images can be previewed', 'err');
});

// 回收站整块重画（动作按钮很多，重画最稳）；存储浏览只重排本地已加载的行（见 render() 里的注册）。

const DASH = '—';
function fmtRes(f){ return (f.width && f.height) ? `${f.width}×${f.height}` : DASH; }
function fmtDur(ms){
  if(!ms) return DASH;
  const s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = x => String(x).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
}
function fmtRate(bps){
  if(!bps) return DASH;
  if(bps >= 1e6){
    // ≥10 Mbps 保留 1 位小数：31.4 Mbps 比 31.40 Mbps 更短，正好躲开列宽截断
    const m = bps / 1e6;
    return (m >= 10 ? m.toFixed(1) : m.toFixed(2)) + ' Mbps';
  }
  return Math.round(bps/1e3) + ' kbps';
}
/** 帧率：最多两位小数，且去掉多余的 .00（29.97 保留，30 不显示成 30.00） */
function fmtFps(v){
  if(!v) return DASH;
  const n = Math.round(Number(v) * 100) / 100;
  return Number.isFinite(n) ? String(n) : DASH;
}
const isImgFile = f => /^image\//.test(f.mime || '') || /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(f.name || '');
const isVidFile = f => /^video\//.test(f.mime || '') || /\.(mp4|m4v|mov|webm|mkv|avi)$/i.test(f.name || '');

/** 进入某个路径。回收站是"派生视图"（服务端明确拒绝直接列它），交给回收站页签渲染。 */

function renderSelBar(){

/** 按 FM.sel 回写复选框（含表头"全选"的三态判断） */
function syncChecks(){
  $$('#fm-list .fm-ck').forEach(c => { c.checked = FM.sel.has(c.dataset.key); });
  const boxes = $$('#fm-list .fm-ck').filter(c => !c.disabled);

/**
 * 批量删除（默认：移入回收站）。
 *
 * ⚠️ 这里**必须** try/catch：一次删上千项时服务端会花很久，旧代码是
 *    `await api(...)` 直接往上抛 —— 未捕获的 Promise rejection 只会静默地什么都不做，
 *    表现就是"点了确认之后没反应"。删完（成功或失败）都要刷新列表，
 *    否则用户看到的是旧数据，同样像"没删掉"。
 */
/** 清选择：FM.sel + 复选框 + 操作条要一起回状态。
 *  ⚠️ 少了 syncChecks/renderSelBar 的话，行首的勾还亮着、操作条却不出来了，
 *     用户再点那个勾等于点了个空壳（看着像"点了没反应"）。 */
function clearSel(){
  FM.sel.clear();
  curClear();
  syncChecks();
  renderSelBar();
}

async function batchDelete(){
  const files = selFiles(), dirs = selDirs();
  const total = files.length + dirs.length;
  if(!total) return;
  const mode = await deleteDialog(total);
  // 取消也要清选择：留着勾就像"还选着"，用户下次点那个勾是"取消勾选"，看着又像卡住了
  if(mode === null){ clearSel(); return; }
  if(mode === 'purge'){ await batchPurge(files, dirs); return; }

  const btn = $('#sel-del');
  if(btn) btn.disabled = true;
  let n = 0, err = null;
  try{
    if(files.length){
      const r = await api('/api/admin/files/delete', { method:'POST', body: JSON.stringify({ ids: files }) });
      n += r.trashed || 0;
    }
    for(const p of dirs){
      const r = await api('/api/admin/dirs/delete', { method:'POST', body: JSON.stringify({ path: p }) });
      n += r.trashed || 0;
    }
  }catch(e){ err = e; }
  if(btn) btn.disabled = false;
  clearSel();
  loadFiles(FM.path);                       // 无论成败都刷：删失败了也要让用户看到还是老样子
  if(err) toast(err.message || (LANG === 'zh' ? '删除失败' : 'Delete failed'), 'err');
  else toast(t('trashedN', { n }));
}

/** 彻底删除：抹掉文件行 + 存储对象，不可恢复。二次确认由 purgeDialog 兜。 */
async function batchPurge(files, dirs){
  const total = files.length + dirs.length;
  // 取消 ⇒ 直接回文件界面，什么都不做（选择也一起清掉，别留半截状态）
  if(!(await purgeDialog(total))){ clearSel(); return; }
  const btn = $('#sel-del');
  if(btn) btn.disabled = true;
  let n = 0, err = null;
  try{
    for(const p of dirs){
      const r = await api('/api/admin/dirs/purge', { method:'DELETE', body: JSON.stringify({ path: p }) });
      n += r.purged || 0;
    }
    if(files.length){
      const r = await api('/api/admin/files/purge', { method:'DELETE', body: JSON.stringify({ ids: files }) });
      n += r.purged || 0;
    }
  }catch(e){ err = e; }
  if(btn) btn.disabled = false;
  clearSel();
  loadFiles(FM.path);
  if(err) toast((LANG === 'zh' ? '彻底删除失败：' : 'Purge failed: ') + (err.message || ''), 'err');
  else toast(t('purgeDone', { n }));
}

/* ── 移动到… ────────────────────────────────────────
   选择器而不是手打路径：目标清单由服务端按**当前身份**筛过（/api/admin/dirs/writable），

/* ═══════════ 列数控制（自动 + 手动）═══════════
   核心取舍：真正的列数**永远由可用宽度算出来**（auto），手动只调一个"偏置 bias"。
   于是两个需求同时成立 ——
     · 横向拉伸/收窄窗口 → auto 变化 → 列数自动增减；
     · 用户按 ± → bias 变化 → 在当前基础上增减。
   若把手动值写死，缩放就会失效（那是另一套需求）；若只保留自动，就没了手动。
   点中间的「列数」文字 = bias 归零 = 回到纯自动。 */
const COL = { bias: 0, eff: 1, actual: 1 };

/* ── 每个页签的"单列目标宽度"；unit=0 表示该页固定单列、不受列数控制 ──
   为什么按页签给不同目标宽：媒体的详细信息表要放 8 列（约需 880px），
   设置页是卡片（400px 足够）。用同一个目标宽会互相拖累。
   bias 是**全局**的：在任意页面按 ± ，所有支持分列的页面都会一起变。 */
const TAB_LAYOUT = {
  files:    { unit: 880 },   // 缩略图模式改用滑杆值，见 colUnit()
  trash:    { unit: 900 },
  settings: { unit: 400 },
  storage:  { unit: 900 },
  shares:   { unit: 900 },
  direct:   { unit: 900 },
  logs:     { unit: 900 },
  codes:    { unit: 900 },
  security: { unit: 900 },   // 仅下方审计表参与分列；顶部筛选条是独立元素，天然单列
  bans:     { unit: 0 },     // 手动封禁 IP —— 用户明确要求固定单列
  global:   { unit: 0 },     // 全球下载分布 —— 图表，固定单列满宽
  overview: { unit: 0 },     // 概览自带栅格
  webdav:   { unit: 0 },
};
function layoutOf(tab){ return TAB_LAYOUT[tab || currentTab] || { unit: 0 }; }
function supportsCols(tab){ return layoutOf(tab).unit > 0; }
function colMax(){ return FM.view === 'thumbs' ? 20 : 6; }

/** 当前页签的单列目标宽度（0 = 不支持分列） */
function colUnit(){
  const lay = layoutOf();
  if(lay.unit <= 0) return 0;
  // 文件页的缩略图模式：单块目标宽 = 滑杆值 —— 这就是滑杆与列数的联动点
  if(currentTab === 'files' && FM.view === 'thumbs') return FM.thumb;
  return lay.unit;
}
function viewAvail(){
  const host = $('#view');
  return Math.max(280, (host && host.clientWidth ? host.clientWidth : window.innerWidth) - 2);
}
function autoCols(){
  const unit = colUnit();
  return unit <= 0 ? 1 : Math.max(1, Math.floor(viewAvail() / unit));
}
/** 缩略图模式：由"生效列数"反推单块宽度，用于把滑杆位置同步过去（双向联动） */
function thumbFromCols(){
  const v = Math.round(viewAvail() / Math.max(1, COL.eff));
  return Math.min(THUMB_MAX, Math.max(THUMB_MIN, v));
}

/** 算出生效列数 → 写进 CSS 变量 → 更新顶栏标签。返回是否发生了变化 */
function syncCols(opts){
  const fromSlider = !!(opts && opts.fromSlider);
  const can = supportsCols();
  const max = can ? colMax() : 1;
  const eff = can ? Math.min(max, Math.max(1, autoCols() + COL.bias)) : 1;
  const changed = eff !== COL.eff;
  COL.eff = eff;
  document.documentElement.style.setProperty('--ui-cols', String(eff));
  const num = $('#col-num'); if(num) num.textContent = String(eff);
  const lbl = $('#col-lbl'); if(lbl) lbl.classList.toggle('manual', can && COL.bias !== 0);
  const ctl = $('#colctl'); if(ctl) ctl.classList.toggle('off', !can);
  const mi = $('#col-minus'), pl = $('#col-plus');
  if(mi) mi.disabled = !can || eff <= 1;
  if(pl) pl.disabled = !can || eff >= max;
  // 缩略图模式：把滑杆同步成"与列数一致的大小"。
  // 用户正在拖滑杆时不回写 —— 否则会跟手指较劲（值被反复覆盖）。
  if(can && !fromSlider && currentTab === 'files' && FM.view === 'thumbs'){
    const s = $('#fm-thumb');
    // 列数变化（± 按钮 / 改窗口宽度 / 点标题复位）会顺手把滑杆挪到对应大小 ⇒ 同样要触发升档
    if(s){ const v = String(thumbFromCols()); if(s.value !== v){ s.value = v; FM.thumb = +v; scheduleThumbUpgrade(); } }
  }
  return changed;
}

/* ═══ 分列渲染：两套容器共用同一个列数 ═══ */

/** 页面把"实际渲染出的列数"回报给顶栏。
 *  为什么需要：顶栏数字必须等于页面上真实存在的列数 —— 内容太少时会自动少分几列，
 *  若仍显示目标值就会出现"写着 5 列、实际 2 列"的错位（用户报过同类 bug）。 */
function reportActualCols(n){
  COL.actual = n;
  const el = $('#col-num'); if(el) el.textContent = String(n);
}

/** 卡片类容器：把直接子项按列优先均分进 .fcol。
 *  可重复调用 —— 已经分过列时会先从 .fcol 里拍平再重排，所以 ± 调整无需重新请求接口。 */
function flowColumns(wrap){
  if(!wrap) return;
  const items = [...wrap.children].flatMap(c =>
    (c.classList && c.classList.contains('fcol')) ? [...c.children] : [c]);
  if(!items.length) return;
  // 每列至少 2 个才值得分列，否则会出现"一列一个、剩下几列空的"的破碎布局
  const n = Math.max(1, Math.min(COL.eff, Math.floor(items.length / 2)));
  wrap.innerHTML = '';
  const cols = Array.from({ length: n }, () => {
    const d = document.createElement('div'); d.className = 'fcol'; return d;
  });
  const per = Math.max(1, Math.ceil(items.length / n));
  items.forEach((el, i) => cols[Math.min(n - 1, Math.floor(i / per))].appendChild(el));
  cols.forEach(c => wrap.appendChild(c));
  reportActualCols(n);
}

/** 按列数重排一个 .tbl-cols 容器（从首次分列时保存的源数据重建） */
function renderTableCols(container){
  const src = container.__tblSrc;
  if(!src) return;
  const rows = src.rows;
  // 同样：每列至少 2 行，行数太少就少分几列（并把实际列数回报给顶栏）
  const n = Math.max(1, Math.min(COL.eff, Math.floor(rows.length / 2)));
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'fmc';
  splitColumns(rows, n).forEach(col => {
    const box = document.createElement('div'); box.className = 'fcol';
    const scroller = document.createElement('div'); scroller.style.overflowX = 'auto';
    const tbl = document.createElement('table'); tbl.className = src.cls;
    const thead = document.createElement('thead'); thead.innerHTML = src.thead;
    const tbody = document.createElement('tbody');
    // ⚠️ 行元素是"搬"过去而不是复制 ⇒ 每行只出现一次，不会产生重复 id / 重复绑定
    col.forEach(r => tbody.appendChild(r));
    tbl.appendChild(thead); tbl.appendChild(tbody);
    scroller.appendChild(tbl); box.appendChild(scroller); grid.appendChild(box);
  });
  container.appendChild(grid);
  reportActualCols(n);
}

/** 把 #view 里的普通表格变成可随列数重排的容器。
 *  rebuild=false：首次（把 table 换成容器并保存源数据）
 *  rebuild=true ：重排（列数变了，用保存的源数据重建） */
function splitListTables(root, rebuild){
  if(!root) return;
  if(rebuild){
    root.querySelectorAll('.tbl-cols').forEach(c => { if(c.__tblSrc) renderTableCols(c); });
    return;
  }
  [...root.querySelectorAll('table.tbl')].forEach(t => {
    const tbody = t.tBodies[0];
    if(!tbody) return;
    const container = document.createElement('div');
    container.className = 'tbl-cols';
    container.__tblSrc = {
      cls: t.className,
      thead: t.tHead ? t.tHead.innerHTML : '',
      rows: [...tbody.rows],
    };
    const holder = t.parentElement;          // 通常是 <div style="overflow-x:auto">
    holder.replaceWith(container);
    renderTableCols(container);
  });
}
