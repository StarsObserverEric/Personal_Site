/* ═══════════ 媒体元数据探测（在浏览器里做）═══════════
   为什么不放服务端：Worker 运行时没有 ffprobe / ImageMagick，
   而浏览器自带解码器（Image / HTMLVideoElement），探测零额外成本、也不占 Worker CPU。
   探测是**尽力而为**：拿不到就留空（界面显示 —），绝不阻塞上传。 */
function b64Json(obj){
  try{
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let bin = '';
    for(const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  }catch(e){ return ''; }
}
const readU32 = (b,o) => (((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0);
const fourcc  = (b,o) => String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);

/**
 * 轻量 MP4/MOV 解析：取帧率与**分轨**码率。
 * 关键点：只读 box 头、按 size 直接跳过内容，所以即使 mdat 有几十 GB 也不会真读它。
 * 拿不到（如分片 MP4、WebM）就返回 null，由调用方留空。
 */
async function probeMp4(file){
  const read = async (start, len) => new Uint8Array(await file.slice(start, start + len).arrayBuffer());
  const tracks = [];
  try{
    async function walk(start, end, tr){
      let p = start;
      while(p + 8 <= end){
        const h = await read(p, Math.min(16, end - p));
        if(h.length < 8) return;
        let size = readU32(h, 0);
        const type = fourcc(h, 4);
        let hdr = 8;
        if(size === 1){                                   // 64 位长度
          if(h.length < 16) return;
          size = readU32(h,8) * 4294967296 + readU32(h,12); hdr = 16;
        } else if(size === 0){ size = end - p; }           // 延伸到末尾
        if(size < hdr || p + size > end) return;
        const at = p + hdr, stop = p + size;

        if(type === 'trak'){
          const nt = { kind: '', timescale: 0, duration: 0, bytes: 0, samples: 0 };
          tracks.push(nt);
          await walk(at, stop, nt);
        } else if(type === 'moov' || type === 'mdia' || type === 'minf' || type === 'stbl' || type === 'edts'){
          await walk(at, stop, tr);
        } else if(tr && type === 'hdlr'){
          const b = await read(at, Math.min(16, stop - at));
          if(b.length >= 12) tr.kind = fourcc(b, 8);       // payload 偏移 8 = handler_type
        } else if(tr && type === 'mdhd'){
          const b = await read(at, Math.min(32, stop - at));
          if(b[0] === 1 && b.length >= 32){
            tr.timescale = readU32(b,20); tr.duration = readU32(b,24) * 4294967296 + readU32(b,28);
          } else if(b.length >= 20){
            tr.timescale = readU32(b,12); tr.duration = readU32(b,16);
          }
        } else if(tr && type === 'stts'){
          const b = await read(at, Math.min(16, stop - at));
          if(b.length >= 8){
            const n = readU32(b,4);
            const take = Math.min(n, 512);
            const e = await read(at + 8, take * 8);
            let sc = 0;
            for(let i = 0; i + 7 < e.length; i += 8) sc += readU32(e, i);
            tr.samples = sc;
          }
        } else if(tr && type === 'stsz'){
          const b = await read(at, Math.min(16, stop - at));
          if(b.length >= 12){
            const fixed = readU32(b,4), cnt = readU32(b,8);
            if(fixed > 0){
              tr.bytes = fixed * cnt;
            } else {
              const tbl = await read(at + 12, cnt * 4);     // 变长样本表：整张读进来求和
              let sum = 0;
              for(let i = 0; i + 3 < tbl.length; i += 4) sum += readU32(tbl, i);
              tr.bytes = sum;
            }
          }
        }
        p += size;
      }
    }
    await walk(0, file.size, null);
    const v = tracks.find(x => x.kind === 'vide');
    const a = tracks.find(x => x.kind === 'soun');
    const durSec = v && v.timescale ? v.duration / v.timescale : 0;
    const fps = v && v.samples && durSec > 0 ? v.samples / durSec : 0;
    const out = {
      fps: fps > 0 && fps < 1000 ? Math.round(fps * 1000) / 1000 : null,
      v_bitrate: v && durSec > 0 && v.bytes ? Math.round(v.bytes * 8 / durSec) : null,
      a_bitrate: a && durSec > 0 && a.bytes ? Math.round(a.bytes * 8 / durSec) : null,
    };
    // 三项都拿不到 ⇒ 当作"解析失败"返回 null（统一语义：拿不到就是拿不到）
    return (out.fps || out.v_bitrate || out.a_bitrate) ? out : null;
  }catch(e){ return null; }
}

async function probeFile(file){
  const meta = {};
  if(file.lastModified) meta.mtime = file.lastModified;
  const img = /^image\//.test(file.type || '') || /\.(png|jpe?g|gif|webp|bmp|avif|svg)$/i.test(file.name);
  const vid = /^video\//.test(file.type || '') || /\.(mp4|m4v|mov|webm|mkv|avi)$/i.test(file.name);

  if(img){
    try{
      const bmp = await createImageBitmap(file);
      meta.width = bmp.width; meta.height = bmp.height;
      if(bmp.close) bmp.close();
    }catch(e){
      try{
        const wh = await new Promise((res, rej) => {
          const url = URL.createObjectURL(file), im = new Image();
          im.onload = () => { res([im.naturalWidth, im.naturalHeight]); URL.revokeObjectURL(url); };
          im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
          im.src = url;
        });
        meta.width = wh[0]; meta.height = wh[1];
      }catch(e2){ /* 探测失败就留空 */ }
    }
    return meta;
  }

  if(vid){
    // 时长与分辨率：交给浏览器解码器，跨容器格式都准
    try{
      const el = await new Promise((res, rej) => {
        const url = URL.createObjectURL(file), v = document.createElement('video');
        let settled = false;
        const fin = ok => {
          if(settled) return; settled = true;
          URL.revokeObjectURL(url); v.removeAttribute('src');
          ok ? res(v) : rej(new Error('vid'));
        };
        v.preload = 'metadata'; v.muted = true;
        v.onloadedmetadata = () => fin(true);
        v.onerror = () => fin(false);
        v.src = url;
        setTimeout(() => fin(false), 12000);
      });
      if(Number.isFinite(el.duration) && el.duration > 0) meta.duration_ms = Math.round(el.duration * 1000);
      if(el.videoWidth) { meta.width = el.videoWidth; meta.height = el.videoHeight; }
    }catch(e){ /* 解码不了就算了 */ }
    // 帧率与分轨码率：只有 MP4 家族能解析出（WebM/MKV 留空）
    if(/mp4|m4v|mov|quicktime/i.test(file.type || '') || /\.(mp4|m4v|mov)$/i.test(file.name)){
      const m = await probeMp4(file);
      if(m){
        if(m.fps) meta.fps = m.fps;
        if(m.v_bitrate) meta.v_bitrate = m.v_bitrate;
        if(m.a_bitrate) meta.a_bitrate = m.a_bitrate;
      }
    }
  }
  return meta;
}

/* ═══════════ 文件管理器（资源管理器风格） ═══════════ */

      ${FM.view === 'thumbs' ? fmSortNote() : ''}
      ${d.writable === false ? '' : `<button class="btn sm" id="fm-newdir">＋ ${esc(t('fmNewFolder'))}</button>`}
      <button class="btn sm primary" id="fm-upload">⬆ ${esc(t('fmUpload'))}</button>
      ${d.writable === false ? '' : `<button class="btn sm" id="fm-upload-dir">📁 ${esc(t('fmUploadDir'))}</button>`}
      <div class="fm-seg">
        <button id="fm-v-details" class="${FM.view === 'details' ? 'on' : ''}">☰ ${esc(t('fmViewDetails'))}</button>
        <button id="fm-v-thumbs" class="${FM.view === 'thumbs' ? 'on' : ''}">▦ ${esc(t('fmViewThumbs'))}</button>

    <div class="fm-drop" id="fm-drop">${esc(t('fmDropHint'))}</div>
    <div id="fm-upload-list"></div>
    <div id="fm-list"></div>
    <input type="file" id="fm-file" multiple hidden>
    <input type="file" id="fm-folder" webkitdirectory directory multiple hidden>

  const host = $('#fm-host'), fi = $('#fm-file'), drop = $('#fm-drop');
  // ⚠️ 面包屑的点击必须**在这里**绑定，不能指望 renderFileList → bindRowActions：
  //    空目录时 renderFileList 会提前 return，于是面包屑从来没被绑上事件、
  //    表现为"进了子目录后点『根目录』没反应"（用户报的 bug）。
  $$('[data-go]').forEach(a => a.onclick = e => {
    if(e.target.closest('input, button')) return;   // 点复选框/操作按钮不该触发跳转
    e.stopPropagation();
    goPath(a.dataset.go);
  });
  $('#fm-upload').onclick = () => fi.click();
  fi.onchange = () => { const l = [...fi.files]; fi.value = ''; if(l.length) uploadFiles(l); };
  const fdir = $('#fm-folder');
  if(fdir) fdir.onchange = () => {
    // webkitdirectory 选出来的文件自带 webkitRelativePath，直接照搬即可保留目录结构
    const l = [...fdir.files].filter(f => f && (f.webkitRelativePath || f.name));
    fdir.value = '';
    if(l.length) uploadFiles(l.map(f => ({ file: f, rel: f.webkitRelativePath || f.name })));
  };
  $('#fm-upload-dir')?.addEventListener('click', () => fdir && fdir.click());
  const nd = $('#fm-newdir'); if(nd) nd.onclick = newFolderDialog;
  // 全选 / 全不选（缩略图模式下没有表头复选框，这个按钮是唯一入口 ⇒ 两种模式都要有）
  const selAll = $('#fm-selall');
  if(selAll) selAll.onclick = () => {
    const boxes = $$('#fm-list .fm-ck').filter(c => !c.disabled);
    const allOn = boxes.length > 0 && boxes.every(c => c.checked);
    FM.sel.clear();
    if(!allOn) boxes.forEach(c => FM.sel.add(c.dataset.key));
    syncChecks();
    renderSelBar();
  };
  // ⚠️ 切视图必须顺手重算列数：两种视图的"单列目标宽"不一样（缩略图是滑杆值 80~320，
  //    详细信息是 880）。以前只 renderFM() 不重算 ⇒ 从详细信息切到缩略图时列数还停在 1，
  //    于是一张卡片撑满一行、整页变成九张通栏大图（每张还在下原图，拖动直接卡死）。
  $('#fm-v-details').onclick = () => { FM.view = 'details'; fmSavePrefs(); renderFM(); applyCols(); };
  $('#fm-v-thumbs').onclick  = () => { FM.view = 'thumbs';  fmSavePrefs(); renderFM(); applyCols(); };
  // 缩略图模式没有表头，"当前排序"按钮点了直接回详细信息（与切视图是同一个动作）
  const sortNote = $('#fm-sort-note');
  if(sortNote) sortNote.onclick = () => { FM.view = 'details'; fmSavePrefs(); renderFM(); applyCols(); };
  const th = $('#fm-thumb');
  if(th){
    let thumbTimerId = null;
    th.oninput = () => {
      FM.thumb = +th.value; fmSavePrefs();
      // 滑杆 ↔ 列数 双向联动：滑杆变大 → 单块目标宽变大 → 列数自然变少。
      // fromSlider 告诉 syncCols 不要回写滑杆位置，否则会跟用户的手指较劲。
      syncCols({ fromSlider: true });
      // 拖动时每 input 都重建整列表，大图会反复解码 → 页面直接卡死，这里节流到 60ms
      clearTimeout(thumbTimerId);
      thumbTimerId = setTimeout(renderFileList, 60);
      // 拖完停手满 1s，再补一趟升档：把屏幕上的旧档位小图换成"当前滑杆档位"的小图。
      // 每次 oninput 都会把上一颗定时器清掉，所以只有最后一段落手点满 1s 才真正开工。
      scheduleThumbUpgrade();
    };
  }

  // 拖拽上传：单独的投放条 + 整个文件区都能接
  const allowed = d.writable !== false;
  const hoverOn = e => { e.preventDefault(); e.stopPropagation(); if(allowed) drop.classList.add('over'); };
  const hoverOff = e => { e.preventDefault(); drop.classList.remove('over'); };
  host.addEventListener('dragenter', hoverOn);
  host.addEventListener('dragover', hoverOn);
  host.addEventListener('dragleave', hoverOff);
  host.addEventListener('drop', async e => {
    hoverOff(e);
    if(!allowed) return;
    const dt = e.dataTransfer;
    // 先试目录遍历（拖进来的文件夹要靠 webkitGetAsEntry 才能取到内容）；
    // 拿不到条目再退回普通 files —— 普通多选文件走这条路，一个空壳都不会有。
    if(dt && dt.items && dt.items.length){
      try{
        const pairs = await filesFromDataTransfer(dt);
        if(pairs.length){ uploadFiles(pairs); return; }
      }catch(err){ /* 遍历失败就当普通文件丢，别把这次投放吞掉 */ }
    }
    const l = dt && dt.files ? [...dt.files] : [];
    if(l.length) uploadFiles(l);
  });
  drop.addEventListener('click', () => fi.click());

  syncCols();
  renderFileList();
  renderSelBar();
}

/** 把条目按"列优先"均分到 n 列 —— 阅读顺序是自上而下、再进下一列，和报纸一致 */
function splitColumns(items, n){
  const out = Array.from({ length: n }, () => []);
  const per = Math.max(1, Math.ceil(items.length / n));
  items.forEach((it, i) => out[Math.min(n - 1, Math.floor(i / per))].push(it));
  return out;
}

function renderFileList(){
  const d = FM.data, host = $('#fm-list');
  if(!d || !host) return;
  // 登记预览索引：点开大图 / 下载都要按 id 反查"这东西是不是图片、叫什么名字"
  pixIndex('files', (d.files || []).concat(d.dirs || []));
  // ⚠️ 目录与文件**分别**排序再拼：目录恒在最前、且始终按名字排（Windows 也是这样分组），
  //    混在一个数组里排会把文件夹插到文件中间去。
  const items = [
    ...sortRows('files', (d.dirs  || []).map(x => ({ isDir: true,  ...x }))),
    ...sortRows('files', (d.files || []).map(x => ({ isDir: false, ...x }))),
  ];
  if(!items.length){
    host.innerHTML = `<div class="empty"><div class="icon">📂</div>${esc(t('fmEmptyDir'))}</div>`;
    return;
  }
  host.innerHTML = FM.view === 'thumbs' ? thumbsHtml(items) : detailsHtml(items);
  bindRowActions();
  mountThumbs();
}

function thumbsHtml(items){
  /** 卡片左上角的勾选框。系统目录不给勾（与详细信息模式一致） */
  const ck = (key, ro) => `<label class="thumb-ck" title="${esc(t('selectAll'))}">

  return `<div class="fm-thumbs">${items.map(it => {
    if(it.isDir){
      const ro = it.system || it.virtual;
      return `<div class="thumb" data-go="${esc(it.path)}" title="${esc(it.name)}${it.count ? ' · ' + String(it.count).toLocaleString() + ' ' + esc(t('fmFileCount')) : ''}">
        ${ro ? '' : ck('d:' + it.path, false)}
        <div class="pv"><span class="ph">${it.virtual ? '🗑️' : '📁'}</span></div>
        <div class="mt"><div class="n">${esc(it.name)}</div><div class="s">${it.size ? esc(fmtSize(it.size)) : esc(t('fmFolderCount'))}</div></div>
      </div>`;
    }
    const img = isImgFile(it), vid = isVidFile(it);
    // 图片先不给 src：由 mountThumbs() 按"是否靠近视口"决定挂小图还是原图，
    // 这样一屏几十张时只有看得见的那几张在真正解码。
    const pv = img
      ? `<img class="timg" loading="lazy" decoding="async" fetchpriority="low" alt=""
               data-thumb="${esc(it.id)}" data-w="${thumbNeed()}" width="${THUMB_MIN}" height="${THUMB_MIN}">`
      : `<span class="ph">${vid ? '🎬' : esc((extOf(it.name) || '?').toUpperCase().slice(0, 4))}</span>`;
    const extra = vid ? fmtDur(it.duration_ms) : (it.width ? `${it.width}×${it.height}` : '');
    return `<div class="thumb" data-fid="${esc(it.id)}" title="${esc(it.name)}">
      ${ck('f:' + it.id, false)}
      <div class="pv">${pv}</div>
      <div class="mt">
        <div class="n">${esc(it.name)}</div>
        <div class="s">${esc(fmtSize(it.size))}${extra && extra !== DASH ? ' · ' + esc(extra) : ''}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* ═══════════ 预览索引（每个列表的 id → 条目）═══════════
   「文件 / 存储浏览 / 回收站」三处都要能点开看大图，预览前得知道某一行
   到底是图片还是视频、叫什么、多大。三处各自在渲染时往这里登记一份。 */
const PIX = { files: {}, trash: {}, storage: {} };
function pixIndex(list, rows){
  const bag = (PIX[list] = PIX[list] || {});
  for(const r of (rows || [])) if(r && r.id) bag[r.id] = r;
}

/* ═══════════ 条目光标（Windows 资源管理器里的那个"当前项"）═══════════
   点一下条目 → 一圈蓝边（光标）；再点别的 → 光标跟过去。
   光标**独立于复选框多选**：复选框决定"批量操作管哪些"，光标决定"我现在指着哪个"。
   空格 / Enter / 双击 = 打开光标所指的那张图；Esc = 关掉光标（也就取消选择）。 */
const CUR = { list: null, fid: null };
const curEsc = s => { try { return CSS.escape(s); } catch(e){ return String(s).replace(/["\\]/g, '\\$&'); } };
function curOf(node){
  if(!node || !node.closest) return null;
  if(node.closest('#stg-tbody')) return 'storage';
  if(node.closest('#fm-list')) return 'files';
  return 'trash';
}
function curSet(list, fid){ CUR.list = list; CUR.fid = fid; curPaint(); }
function curClear(){ CUR.list = null; CUR.fid = null; curPaint(); }
function curEl(){
  if(!CUR.fid) return null;
  let root = document;
  if(CUR.list === 'trash') root = $('#view') || document;
  else if(CUR.list === 'storage') root = $('#stg-tbody') || document;
  return root ? root.querySelector(`[data-fid="${curEsc(CUR.fid)}"]`) : null;
}
function curPaint(){
  $$('.cur').forEach(el => el.classList.remove('cur'));
  if(!CUR.fid) return;
  const el = curEl();
  if(!el){ CUR.list = null; CUR.fid = null; return; }   // 列表重画后这项没了，光标自动失效
  el.classList.add('cur');
}
/** 光标所指的条目是不是图片（不是就提示，别静默没反应） */
function curCanPreview(){
  const bag = PIX[CUR.list || 'files'] || {};
  const meta = bag[CUR.fid];
  if(!meta) return null;
  return isImgFile(meta) ? { meta, id: CUR.fid } : null;
}

document.addEventListener('click', e => {
  const box = e.target && e.target.closest ? e.target.closest('[data-fid]') : null;
  if(!box) return;
  if(e.target.closest('input, button, a, label, th.sortable')) return;
  curSet(curOf(box), box.dataset.fid);
}, true);   // 捕获阶段：早于行内的 onclick，保证光标一定被设置上

document.addEventListener('dblclick', e => {
  const box = e.target && e.target.closest ? e.target.closest('[data-fid]') : null;
  if(!box) return;
  if(e.target.closest('input, button, a, label')) return;
  curSet(curOf(box), box.dataset.fid);
  openPreview(box.dataset.fid, curOf(box));
});

/* ═══════════ 图片预览（全屏相册式）═══════════
   滚轮 = 以鼠标为中心缩放；双击 = 1:1；拖 = 平移；
   点画面外的黑色区域 / Esc / 空格 = 关闭。缩放时用 transform 做，
   不重排、不重新请求 —— 原图只下一次，之后全靠本地缓存。 */
const LB_MAX = 12, LB_MIN = 0.1;
let LB = null;

function lbEl(tag, cls){ const el = document.createElement(tag); if(cls) el.className = cls; return el; }

function openPreview(id, list){
  const bag = PIX[list || 'files'] || {};
  const meta = bag[id];
  if(!meta){ toast(LANG === 'zh' ? '找不到这个条目' : 'Item not found', 'err'); return; }
  if(!isImgFile(meta)){
    toast(LANG === 'zh' ? '只能预览图片文件（视频请用播放器打开）' : 'Only image files can be previewed', 'err');
    return;
  }
  if(LB && LB.open){ lbClose(); }

  const bg    = lbEl('div', 'lb-bg');
  const spin  = lbEl('div', 'lb-spin');
  const img   = lbEl('img', 'lb-img'); img.alt = meta.name || ''; img.draggable = false;
  // 先估一下原图真实尺寸（列表里就有 width/height），布局框先按它排，缩放才有基准
  img.width = meta.width || 0; img.height = meta.height || 0;
  const tip   = lbEl('div', 'lb-tip');
  tip.textContent = LANG === 'zh'
    ? '滚轮缩放 · 双击 1:1 · 拖动查看 · 点画面外 / Esc / 空格 关闭'
    : 'Wheel zoom · dblclick 1:1 · drag · click outside / Esc / space to close';
  const bar = lbEl('div', 'lb-bar');
  const nm = lbEl('div', 'nm'); nm.textContent = meta.name || id;
  const sub = lbEl('div', 'sub');
  sub.textContent = (meta.size ? fmtSize(meta.size) : '')
    + (meta.width && meta.height ? ' · ' + meta.width + '×' + meta.height : '');
  bar.appendChild(nm); bar.appendChild(sub);

  const wrap = lbEl('div'); wrap.id = 'lb';
  // 手头已有的小图当模糊底衬（相册那股"先糊后清"），原图到了就把它摘掉 —— 大图也能秒开
  const have = (typeof THUMB_HAVE !== 'undefined') ? (THUMB_HAVE.get(id) || []) : [];
  const ph = lbEl('div', 'lb-ph');
  if(have.length) ph.style.backgroundImage = 'url("' + thumbUrl(id, Math.max.apply(null, have)) + '")';
  wrap.appendChild(bg); wrap.appendChild(ph); wrap.appendChild(spin); wrap.appendChild(img); wrap.appendChild(tip); wrap.appendChild(bar);
  document.body.appendChild(wrap);
  LB = {
    open: true, id, list: list || 'files', name: meta.name || id,
    k: 1, tx: 0, ty: 0, el: wrap, img, bg, spin, ph,
    nw: meta.width || 0, nh: meta.height || 0, fit: 1,
  };
  // 布局框先按列表里记的原图尺寸排好：fit 一算就得准，缩放才有稳定基准
  img.width = LB.nw || 0; img.height = LB.nh || 0;
  if(LB.nw && LB.nh){ LB.fit = lbFit(); LB.k = LB.fit; }
  lbPaint();

  const full = new Image();
  let done = false;
  full.onload = () => {
    if(!LB || LB.id !== id || done) return;
    done = true;
    LB.nw = full.naturalWidth; LB.nh = full.naturalHeight;
    LB.fit = lbFit();
    img.width = LB.nw; img.height = LB.nh;
    img.src = full.src;
    if(ph.parentNode) ph.remove();      // 原图到了，模糊底衬退场
    spin.remove();
    lbPaint();
  };
  full.onerror = () => { if(LB && LB.id === id) spin.remove(); };
  full.src = rawUrl(id);
  lbBind();
}

function lbClose(){
  if(!LB || !LB.open) return;
  const el = LB.el, bg = LB.bg;
  LB.open = false;
  bg.style.animation = 'none';   // 关掉时别再跑"压暗"动画，直接黑着淡出
  bg.style.background = '#000';
  el.classList.add('lb-out');
  setTimeout(() => { el.remove(); }, 170);
  lbDragOff();
  LB = null;
}

/* ⚠️ 缩放模型（这块的数学踩过坑，改之前务必先看懂）：
   .lb-img 是 `position:absolute; left/top:50%` + `translate(-50%,-50%)` 居中的，
   而且 `transform-origin: 50% 50%` —— 也就是说 **scale 只放大画面、中心点一动不动**。
   于是"图在屏幕上的中心"恒等于 (视口中心 + (tx,ty))，与 k 毫无关系。
   某图里点 (vx,vy)（单位=原图像素）的屏幕位置是：
       屏幕 = 视口中心 + (tx,ty) + k * ((vx,vy) - (w/2,h/2))
   下面两个函数就是这条式子的正反变换；lbZoomAt/lbOneToOne 只要求"锚点下面那一点不动"。
   早先版本把 `(k-1)*w/2` 也算进了中心里 —— 那是按"scale 绕左上角"推的公式，
   与 transform-origin:50% 50% 冲突，结果一滚轮图就往左上角飞、双击直接飞出屏幕。 */
function lbPaint(){
  if(!LB) return;
  const C = window.innerWidth / 2, D = window.innerHeight / 2;
  const w = LB.k * (LB.nw || 0), h = LB.k * (LB.nh || 0);
  // 平移夹取：图至少留 80px 在画面内，别让人一不小心把图拖丢（ formerly 全黑屏）
  const keep = Math.min(80, w, h);
  const lox = keep - C - w / 2, hix = C + w / 2 - keep;
  const loy = keep - D - h / 2, hiy = D + h / 2 - keep;
  LB.tx = lox > hix ? 0 : Math.max(lox, Math.min(hix, LB.tx));
  LB.ty = loy > hiy ? 0 : Math.max(loy, Math.min(hiy, LB.ty));
  LB.img.style.transform = `translate(-50%,-50%) translate(${LB.tx}px,${LB.ty}px) scale(${LB.k})`;
}
/** 布局尺寸 = 原图真实像素（CSS 没加 max-width 约束），所以 offsetWidth 就是 nw。 */
function lbDims(){
  if(!LB) return { w: 0, h: 0 };
  return { w: LB.nw || LB.img.offsetWidth || 0, h: LB.nh || LB.img.offsetHeight || 0 };
}
/** "整图刚好铺满屏幕"的比例；原图本来就比屏幕小 ⇒ 1（此时 1:1 起步，不能再缩小） */
function lbFit(){
  const d = lbDims();
  if(!d.w || !d.h) return 1;
  return Math.min(1, window.innerWidth / d.w, window.innerHeight / d.h);
}
/** 屏幕点 → 图内点 */
function lbPt2(px, py){
  return {
    x: (LB.nw || 0) / 2 + (px - (window.innerWidth / 2 + LB.tx)) / LB.k,
    y: (LB.nh || 0) / 2 + (py - (window.innerHeight / 2 + LB.ty)) / LB.k,
  };
}
/** 把图内点 (vx,vy) 摆到屏幕 (px,py) 上（缩放 k 已就位时用它解 tx/ty） */
function lbPut(vx, vy, px, py, k){
  LB.k = k;
  LB.tx = px - window.innerWidth / 2 - k * (vx - (LB.nw || 0) / 2);
  LB.ty = py - window.innerHeight / 2 - k * (vy - (LB.nh || 0) / 2);
}
const lbClampK = k2 => Math.max(LB.fit, Math.min(LB_MAX, k2));
/** 以屏幕点 (px,py) 为锚点缩放：缩放前后锚点下的那一个"图内点"保持不动 */
function lbZoomAt(px, py, k2){
  if(!LB) return;
  // 缩到最小(=fit)时顺手把图摆回正中：否则"在边上滚轮缩回去"会留下一张歪在角落的图，
  // 看着像没铺满屏幕。缩到最小就等于"回到整图居中"，符合直觉。
  if(k2 <= LB.fit){ LB.k = LB.fit; LB.tx = 0; LB.ty = 0; lbPaint(); return; }
  const v = lbPt2(px, py);
  lbPut(v.x, v.y, px, py, lbClampK(k2));
  lbPaint();
}
/** 双击：一刀切到 1:1（双击的那一点不动）；已经 1:1 了再双击就回到"整图铺满" */
function lbOneToOne(px, py){
  if(!LB) return;
  const v = lbPt2(px, py);
  const target = LB.k < 0.995 ? 1 : LB.fit;                 // < 1:1 ⇒ 去 1:1；已经是 ⇒ 回铺满
  lbPut(v.x, v.y, px, py, target);
  lbPaint();
}

function lbBind(){
  const img = LB.img;
  // 滚轮挂在整层上（而不是只在图上）：图很小/在画面外时，指针多半压在黑边上，
  // 挂只在图上的话滚了半天没反应，体验上像"卡住了"。
  LB.el.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.14 : 1 / 1.14;
    lbZoomAt(e.clientX, e.clientY, LB.k * f);
  }, { passive: false });
  LB.bg.addEventListener('click', () => lbClose());
  img.addEventListener('dblclick', e => { e.preventDefault(); lbOneToOne(e.clientX, e.clientY); });
  // 拖动平移（超过 4px 才算拖动，否则当成点击，别抢 dblclick）
  let dragging = false, moved = 0, sx = 0, sy = 0;
  img.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; sx = e.clientX; sy = e.clientY;
    img.classList.add('drag');
    try{ img.setPointerCapture(e.pointerId); }catch(err){}
  });
  img.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if(moved > 4){ LB.tx += dx; LB.ty += dy; sx = e.clientX; sy = e.clientY; lbPaint(); }
  });
  const up = () => { dragging = false; img.classList.remove('drag'); };
  img.addEventListener('pointerup', up);
  img.addEventListener('pointercancel', up);
  img.addEventListener('click', e => {
    if(moved > 4) e.stopPropagation();        // 刚拖完别当成点背景
  });
}
function lbDragOff(){ /* 占位：LB 已置 null，事件随 DOM 一起移除 */ }

/* ═══════════ 下载（全局文件管理）═══════════
   权限在服务端：/api/admin/files/{id}/raw 只放"管理员任意文件 / 普通用户自己名下"过。
   这里只负责把一次或多次下载"触发"出来 —— 目录选不下（浏览器不支持），
   所以只要有目录被选中，按钮就是灰的。 */
function doDownload(ids){
  if(!ids || !ids.length) return;
  ids.forEach((id, i) => setTimeout(() => {
    const bag = PIX.files || {};
    const a = document.createElement('a');
    a.href = `/api/admin/files/${encodeURIComponent(id)}/raw?dl=1`;
    a.download = (bag[id] && bag[id].name) || id;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }, i * 180));
  toast(LANG === 'zh' ? `开始下载 ${ids.length} 个文件…` : `Downloading ${ids.length} file(s)…`);
}

/** 递归展开 DataTransfer 里的目录条目。
 *  ⚠️ 拖进来的文件夹在 dataTransfer.files 里只有一个 size=0 的空壳（拿不到内容），
 *     必须逐个 webkitGetAsEntry() 再 readEntries 才能遍历到真实文件。
 *     这就是以前"拖文件夹上传 → 得到一堆 0 字节坏文件"的根因。 */
async function filesFromDataTransfer(dt){
  const out = [];
  const items = dt && dt.items ? [...dt.items] : [];
  const walk = async (entries, prefix) => {
    for(const raw of entries){
      const entry = typeof raw.webkitGetAsEntry === 'function' ? raw.webkitGetAsEntry() : raw;
      if(!entry) continue;
      if(entry.isFile){
        const f = await new Promise(res => entry.file(res, () => res(null)));
        if(f) out.push({ file: f, rel: prefix + f.name });
      } else if(entry.isDirectory){
        const reader = entry.createReader();
        for(;;){
          const batch = await new Promise(res => reader.readEntries(res, () => res([])));
          if(!batch.length) break;               // readEntries 必须读到空数组才算这一层扫完
          await walk(batch, prefix + entry.name + '/');
        }
      }
    }
  };
  await walk(items, '');
  return out;
}

/**
 * 上传一批文件/目录。`input` 可以是 File 数组，也可以是 {file, rel} 数组
 * （rel = 相对当前目录的路径，用于整目录上传时保留子目录结构）。
 * 服务端会自动补齐 rel 里的中间目录（见 filestore.ts 的 ensureDirChain）。
 */
async function uploadFiles(input, baseDir){
  const base = baseDir || FM.path || '/';
  const listHost = $('#fm-upload-list');
  const pairs = (Array.isArray(input) ? input : [input])
    .map(f => (f && f.file) ? f : { file: f, rel: (f && f.name) || '' });
  if(!pairs.length) return;
  let needReload = false;
  for(const { file, rel } of pairs){
    if(!file) continue;
    const name = file.name;
    if(file.size > 100 * 1024 * 1024){ toast(t('tooLarge', {name}), 'err'); continue; }
    // 目录上传：目标目录 = 当前目录 + rel 的父路径，文件名只取最后一段
    const sub = String(rel).split('/').slice(0, -1).join('/');
    const dir = sub ? (base.replace(/\/+$/,'') + '/' + sub) : base;
    const shown = rel || name;
    const item = document.createElement('div');
    item.className = 'upload-item glass';
    item.innerHTML = `${ficon(name)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(shown)}">${esc(shown)}</span>
      <div class="prog"><i></i></div><span class="pct">…</span>`;
    if(listHost) listHost.prepend(item);

    // 先探测元数据（图片宽高 / 视频时长·分辨率·帧率·分轨码率）再上传。
    // 探测失败一律不影响上传 —— 元数据只是锦上添花。
    let metaHeader = '';
    try{ metaHeader = b64Json(await probeFile(file)); }catch(e){ metaHeader = ''; }

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/admin/upload');
    xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    xhr.setRequestHeader('X-File-Path', encodeURIComponent(dir));
    if(metaHeader) xhr.setRequestHeader('X-File-Meta', metaHeader);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e => {
      if(!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      const bar = item.querySelector('.prog i'), tx = item.querySelector('.pct');
      if(bar) bar.style.width = pct + '%';
      if(tx) tx.textContent = pct + '%';
    };
    xhr.onload = () => {
      const tx = item.querySelector('.pct');
      if(xhr.status === 201){
        if(tx) tx.textContent = t('uploadDone');
        toast(t('uploadOk', {name: file.name}));
        // 刚传上去的大图先裁一张小图存好，以后浏览这个目录直接读小图（否则第一次浏览照样整张下载+解码）
        try{ genThumbOnUpload(JSON.parse(xhr.responseText || '{}').id, file); }catch(e){}
        // 注意：整目录上传会落到 base/<子目录>，所以刷新只在"仍停在 base"时进行
        if(FM.path === base) needReload = true;
      } else {
        if(tx) tx.textContent = t('uploadFailShort');
        toast(t('uploadFail', {name: file.name}), 'err');
      }
    };
    xhr.onerror = () => {
      const tx = item.querySelector('.pct');
      if(tx) tx.textContent = t('uploadFailShort');
      toast(t('uploadFail', {name: file.name}), 'err');
    };
    xhr.send(file);
  }
  // 整目录下传完**只刷一次**，别每个文件刷一遍
  if(needReload) loadFiles(base);
}

/* ═══════════ 回收站 ═══════════
   服务端只对**文件**做软删除（见 src/filestore.ts 的模型说明）：
   删目录 = 递归软删其下所有文件 + 移除目录结构行，所以这里列出来的都是文件。
   可见性由服务端按身份过滤：管理员看全部，普通用户只看自己删的。 */
async function loadTrash(){
  const d = await api('/api/admin/trash');
  const items = sortRows('trash', d.items || []);   // ⚠️ 必须在渲染前排，否则表头箭头和行序对不上
  pixIndex('trash', d.items || []);                 // 回收站里也要能点开看大图
  $('#view').innerHTML = `
  <div class="glass section">
    <div class="section-title">
      <h2>🗑️ ${esc(t('trashTitle'))}（${items.length}）</h2>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12.5px;color:var(--text-3)">${esc(t('trashHint'))}</span>
        ${items.length ? `<button class="btn sm danger" id="trash-empty">${esc(t('emptyTrash'))}</button>` : ''}
      </div>
    </div>
    ${items.length ? `
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>
        ${sortTh('trash','name',t('colName'),'')}
        ${sortTh('trash','origin',t('colOrigin'),'')}
        ${sortTh('trash','size',t('colSize'),'')}
        ${sortTh('trash','by',t('colDeletedBy'),'')}
        ${sortTh('trash','at',t('colDeletedAt'),'')}
        ${sortTh('trash','left',t('colDaysLeft'),'')}
        <th style="width:150px">${esc(t('colActions'))}</th>
      </tr></thead>
      <tbody>${items.map(it => `
        <tr data-fid="${esc(it.id)}">
          <td class="name-cell" title="${esc(it.name)}">${ficon(it.name)} ${esc(it.name)}</td>
          <td class="mono">${esc(it.original_path || '/')}</td>
          <td class="num">${fmtSize(it.size)}</td>
          <td>${esc(it.deleted_by || '—')}</td>
          <td class="num">${fmtTime(it.deleted_at)}</td>
          <td class="num">${it.days_left != null ? esc(t('daysLeftN', { n: it.days_left })) : '—'}</td>
          <td><div class="actions-cell">
            <button class="btn sm" data-restore="${it.id}">${esc(t('restore'))}</button>
            <button class="btn sm danger" data-purge="${it.id}" data-name="${esc(it.name)}">${esc(t('purge'))}</button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table></div>` : `<div class="empty"><div class="icon">🗑️</div>${esc(t('noTrash'))}</div>`}
  </div>`;

  const emptyBtn = $('#trash-empty');
  if(emptyBtn) emptyBtn.onclick = async () => {
    if(!(await confirmDialog(t('confirmEmptyTrashT'), t('confirmEmptyTrashD')))) return;
    const r = await api('/api/admin/trash?all=1', { method:'DELETE' });
    toast(t('purgedN', { n: r.purged || 0 }));
    loadTrash();
  };
  $$('[data-restore]').forEach(b => b.onclick = async () => {
    const r = await api('/api/admin/trash/restore', { method:'POST', body: JSON.stringify({ ids: [b.dataset.restore] }) });
    toast(t('restoredN', { n: r.restored || 0 }));
    loadTrash();
  });
  // 回收站里的「彻底删除」：回收站条目本来就在等着被抹掉，没有"再软删一次"这一步，
  // 所以直接二次确认 + 冷静期（不需要 deleteDialog 那个"移入回收站"的选项）。
  $$('[data-purge]').forEach(b => b.onclick = async () => {
    if(!(await confirmDialog(t('confirmPurgeT'), t('confirmPurgeD', { name: b.dataset.name })))) return;
    if(!(await purgeDialog(1))) return;
    try{
      const r = await api('/api/admin/trash', { method: 'DELETE', body: JSON.stringify({ ids: [b.dataset.purge] }) });
      toast(t('purgedN', { n: r.purged || 0 }));
      loadTrash();
    }catch(e){ toast(e.message, 'err'); loadTrash(); }
  });
}

/* ═══════════ 存储浏览（S3 / R2） ═══════════ */
let _stgPrefix = '';
let _stgMarker = undefined;
async function loadStorage(){
  const isZh = LANG === "zh";
  const getView = () => document.getElementById('view');

  function breadcrumbs(prefix){
    const parts = prefix ? prefix.split('/').filter(Boolean) : [];
    const arr = [{ name: isZh ? '根目录' : 'Root', prefix: '' }];
    let acc = '';
    for (const p of parts){
      acc += p + '/';
      arr.push({ name: p, prefix: acc });
    }
    return arr;
  }

  async function render(){
    const view = getView();
    if (!view) return;
    view.innerHTML = `<div class="spin"></div>`;
    try{
      const url = `/api/admin/storage/objects?prefix=${encodeURIComponent(_stgPrefix || '')}${_stgMarker ? '&marker=' + encodeURIComponent(_stgMarker) : ''}&limit=100`;
      const r = await api(url);
      const kind = r.kind === 'r2' ? 'R2' : r.kind === 'webdav' ? 'WebDAV' : 'S3';
      const bc = breadcrumbs(_stgPrefix);

      const bcHtml = bc.map((part, i) => {
        const isLast = i === bc.length - 1;
        const label = esc(part.name);
        if (isLast) return `<span style="font-family:ui-monospace,monospace">${label}</span>`;
        return `<a href="javascript:void(0)" data-prefix="${esc(part.prefix)}" class="stg-bc" style="color:var(--blue);text-decoration:none;font-family:ui-monospace,monospace">${label}</a>`;
      }).join('<span style="opacity:.35;margin:0 6px">/</span>');

      // 目录永远在最前（和"文件"页一致），其余按当前排序状态；
      // ⚠️ 只排本地已加载的这一页，分页加载更多后仍是"当前这页内部排序"。
      const allRows = [...(r.entries ?? [])];
      const rows = sortRows('storage', allRows.filter(x => x.isDir))
        .concat(sortRows('storage', allRows.filter(x => !x.isDir)));

      let html2 = `
        <div class="glass group" style="padding:18px 22px">
          <div class="row" style="gap:12px;flex-wrap:wrap">
            <div style="flex:1;min-width:260px">
              <div style="font-size:13px;opacity:.6;margin-bottom:4px">${isZh ? '当前路径' : 'Current path'}</div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span style="opacity:.5">${kind}</span>
                <span style="opacity:.35">·</span>
                ${bcHtml}
              </div>
              <div style="font-size:12px;opacity:.45;margin-top:7px;line-height:1.6;max-width:760px">${esc(t('stgNote'))}</div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn sm" id="stg-refresh">🔄 ${isZh?'刷新':'Refresh'}</button>
              <button class="btn sm ok" id="stg-dl-sel" disabled>${isZh ? '⬇ 下载选中' : '⬇ Download'}</button>
              <button class="btn sm danger" id="stg-delete-sel">🗑️ ${isZh ? '删除选中' : 'Delete Selected'}</button>
            </div>
          </div>
        </div>
        <div class="glass group" style="padding:0;overflow:auto">
          <table class="tbl" style="margin:0">
            <thead><tr>
              <th style="width:36px"><input type="checkbox" id="stg-check-all"></th>
              ${sortTh('storage','name',t('colName'),'')}
              ${sortTh('storage','size',t('colSize'),'120px')}
              ${sortTh('storage','time',t('stgUploadTime'),'170px')}
              ${sortTh('storage','owner',t('stgUploader'),'110px')}
              ${sortTh('storage','loc',t('stgLocation'),'200px')}
              <th style="width:150px">${esc(t('colActions'))}</th>
            </tr></thead>
            <tbody id="stg-tbody">
      `;
      if (rows.length === 0){
        html2 += `<tr><td colspan="7" style="text-align:center;padding:48px;opacity:.6">${isZh ? '此目录为空' : 'This directory is empty'}</td></tr>`;
      } else {
        const recList = [];   // 有数据库记录的那些对象 ⇒ 可预览 / 可下载
        html2 += rows.map(e => {
          const rowKey = esc(e.key);
          if (e.isDir){
            return e.__html = `<tr data-key="${rowKey}">
              <td></td>
              <td><a href="javascript:void(0)" class="stg-dir" data-prefix="${esc(e.key)}" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:8px">📁 <strong>${esc(e.name.replace(/\/$/, ''))}</strong></a></td>
              <td style="opacity:.35">—</td>
              <td style="opacity:.35">—</td>
              <td style="opacity:.35">—</td>
              <td style="opacity:.35">—</td>
              <td></td>
            </tr>`;
          }
          // ⚠️ 旧版这里直接显示 R2 对象 key（一串乱码），和"文件"页对不上。
          //    现在有数据库记录的就显示真实文件名（下面灰字仍可看到原始 key），
          //    没有记录的孤儿对象才回退成 key —— 这样两个页签看到的都是同一个名字。
          const rec = e.record || null;
          if(rec) recList.push(rec);
          const shownName = rec ? rec.name : e.name;
          const keyTail = e.name;
          const icon = ficon(shownName);
          const time = rec && rec.uploaded_at ? rec.uploaded_at : e.lastModified;
          const loc = rec ? rec.path : '';
          return e.__html = `<tr data-key="${rowKey}" data-fid="${esc(rec ? rec.id : '')}">

            <td>
              <div style="display:flex;align-items:center;gap:8px;min-width:0">${icon}<span class="stg-nm" title="${esc(shownName)}">${esc(shownName)}</span></div>
              <div class="stg-key" title="${esc(e.key)}">${esc(keyTail)}</div>
            </td>
            <td class="num">${fmtSize(e.size)}</td>
            <td class="num" style="white-space:nowrap">${time ? fmtTime(time) : '—'}${rec && rec.in_trash ? ` <span style="color:#fda293">${esc(t('inTrashShort'))}</span>` : ''}</td>

            <td style="white-space:nowrap">

              <button class="btn sm" data-copy-key="${rowKey}" title="${esc(t('stgCopyKey'))}">📋</button>
            </td>
          </tr>`;
        }).join('');
        pixIndex('storage', recList);
      }
      // 登记"点表头怎么重排"：把这一页各行已经拼好的 html 存下来，
      // 点排序表头时只重排 innerHTML，不重新请求接口、也不闪一下 spinner。
      SORT_ROWS.storage = rows;
      SORT_RERENDER.storage = () => {
        const tb = document.getElementById('stg-tbody');
        if(!tb || !rows.length) return;
        tb.innerHTML = sortRows('storage', rows.filter(x => x.isDir))
          .concat(sortRows('storage', rows.filter(x => !x.isDir)))
          .map(x => x.__html || '').join('');
      };

      html2 += `</tbody></table>
        </div>
        ${r.truncated ? `<div style="text-align:center;padding:14px"><button class="btn" id="stg-load-more">${isZh ? '加载更多…' : 'Load more…'}</button></div>` : ''}
      `;
      const v2 = getView();
      if (v2) v2.innerHTML = html2;

      // ── 事件绑定（只绑一次成功渲染后） ──
      document.getElementById('stg-refresh')?.addEventListener('click', () => { _stgMarker = undefined; render(); });
      document.getElementById('stg-load-more')?.addEventListener('click', () => { render(); });

      document.querySelectorAll('.stg-bc').forEach(a => {
        a.addEventListener('click', () => {
          _stgPrefix = a.dataset.prefix || '';
          _stgMarker = undefined;
          render();
        });
      });

      document.querySelectorAll('.stg-dir').forEach(a => {
        a.addEventListener('click', () => {
          _stgPrefix = a.dataset.prefix || '';
          _stgMarker = undefined;
          render();
        });
      });

      document.querySelectorAll('[data-copy-key]').forEach(b => {
        b.addEventListener('click', () => copyText(b.dataset.copyKey));
      });

      document.querySelectorAll('[data-goto]').forEach(b => {
        b.addEventListener('click', () => gotoFileRecord(
          b.dataset.goto || '', b.dataset.dir || '', b.dataset.trash === '1'
        ));
      });

      const checkAll = document.getElementById('stg-check-all');
      const dlSel = document.getElementById('stg-dl-sel');
      // 存储浏览只能勾选到文件行（目录行的复选框列是空的）⇒ "有勾选 = 能下载"
      const syncStgDl = () => {
        const n = document.querySelectorAll('.stg-chk:checked').length;
        if(dlSel) dlSel.disabled = n === 0;
      };
      if (checkAll){
        checkAll.addEventListener('change', () => {
          document.querySelectorAll('.stg-chk').forEach(c => c.checked = checkAll.checked);
          syncStgDl();
        });
      }
      document.querySelectorAll('.stg-chk').forEach(c => c.addEventListener('change', syncStgDl));
      dlSel?.addEventListener('click', () => {
        const ids = [...document.querySelectorAll('.stg-chk:checked')]
          .map(c => c.closest('tr')?.dataset.fid).filter(Boolean);
        doDownload(ids);
      });

      document.getElementById('stg-delete-sel')?.addEventListener('click', async () => {
        const keys = [...document.querySelectorAll('.stg-chk:checked')].map(c => c.closest('tr')?.dataset.key).filter(Boolean);
        if (keys.length === 0){ toast(isZh ? '请先选择要删除的对象' : 'Select at least one object first', 'err'); return; }
        if (!(await confirmDialog(
          isZh ? `删除 ${keys.length} 个对象？` : `Delete ${keys.length} objects?`,
          isZh ? '此操作会直接从存储中删除对象，数据库文件记录不受影响。不可恢复。' : 'This removes objects directly from storage. DB file records are not affected. Cannot be undone.',
          true
        ))) return;
        try{
          const r2 = await api('/api/admin/storage/objects', { method:'DELETE', body: JSON.stringify({ keys }) });
          toast((isZh ? '已删除 {n} 个对象' : 'Deleted {n} objects').replace('{n}', r2.deleted));
          _stgMarker = undefined;
          render();
        }catch(e2){ toast(e2.message, 'err'); }
      });
    }catch(e){
      const v3 = getView();
      if (v3) v3.innerHTML = `<div class="glass group" style="padding:32px;text-align:center;opacity:.85">
        <div style="font-size:18px;font-weight:600;margin-bottom:8px">${isZh ? '存储浏览暂不可用' : 'Storage browser unavailable'}</div>
        <div style="font-size:13px;opacity:.7">${esc(e.message || e)}</div>
      </div>`;
    }
  }
  render();
}

/* ═══════════ 存储浏览 → 文件页「定位」 ═══════════
   点一下 📍：切到「文件」页 → 进到该文件所在目录 → 滚动到它并高亮 5 秒。
   高亮用临时 class（.hl-tmp），5 秒后自动摘掉，不会污染其它渲染。 */
async function gotoFileRecord(fileId, dir, inTrash){
  const zh = LANG === 'zh';
  const hl = (selector, label) => {
    const el = document.querySelector(selector);
    if(!el){
      toast(zh ? '未找到该条目（可能已被删除）' : 'Item not found (maybe deleted)', 'err');
      return;
    }
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.remove('hl-tmp');
    void el.offsetWidth;              // 强制回流，保证同一次点击能重复触发动画
    el.classList.add('hl-tmp');
    setTimeout(() => el.classList.remove('hl-tmp'), 5000);
    if(label) toast(zh ? `已定位到「${label}」` : `Jumped to "${label}"`);
  };

  if(!fileId){
    toast(zh ? '该对象没有数据库记录（孤儿对象），无法定位' : 'No DB record for this object', 'err');
    return;
  }
  if(inTrash){
    switchTab('trash', { skipLoad:true });
    await loadTrash();
    hl(`#view [data-fid="${fileId}"]`);
    return;
  }
  // 详细信息模式才有稳定的表格行（缩略图是卡片，定位同样能滚过去，但行更好认）
  FM.view = 'details';
  switchTab('files', { skipLoad:true });
  // ⚠️ 顺序：先把目标目录写进 FM.path，再加载。switchTab 那次隐式加载会带着
  //    旧路径跑一遍，谁后返回谁覆盖 FM.path —— 不这么写线上会被打回根目录。
  FM.path = dir || FM.start || '/';
  await loadFiles(FM.path);
  hl(`#fm-list [data-fid="${fileId}"]`);
}

let echartsLoaded = false;

/** 动态加载 ECharts + echarts-gl + world-atlas（首次进入全球分布 Tab 时才加载） */
function ensureECharts(){
  if (echartsLoaded) return Promise.resolve();
  if (echartsLoadingPromise) return echartsLoadingPromise;
  echartsLoadingPromise = new Promise((resolve, reject) => {
    // 按顺序加载：echarts → echarts-gl → world-atlas 地图数据
    const loadScript = (src, cb) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = cb;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    };
    loadScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js', () => {
      loadScript('https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js', () => {
        loadScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/map/json/world.json', () => {
          echartsLoaded = true;
          resolve();
        });
      });
    });
  });
  return echartsLoadingPromise;
}

        <div style="color:var(--text-3);font-size:12px;margin-bottom:6px">${esc(t('codesGeneratedPreview'))}</div>
        <div style="background:rgba(0,0,0,.3);border-radius:12px;padding:12px;font-family:ui-monospace,'SF Mono',monospace;font-size:12px;color:#fde68a;line-height:1.7;max-height:200px;overflow:auto">
          ${preview.map(c => `<div>${esc(c)}</div>`).join('')}
        </div>
      `;
      codesPage = 1;
      loadCodesList();
    } catch(err) { toast(err.message, 'err'); }
  };

  // 过滤器
  $('#cf-status').onchange = () => { codesStatus = $('#cf-status').value; codesPage = 1; loadCodesList(); };
  $('#cf-batch').onchange = () => { codesBatchId = $('#cf-batch').value; codesPage = 1; loadCodesList(); };
  $('#cf-q').addEventListener('input', (e) => {
    clearTimeout(window.__codesQ_t);
    window.__codesQ_t = setTimeout(() => { codesQ = e.target.value.trim(); codesPage = 1; loadCodesList(); }, 300);
  });

  // CSV 导出
  $('#cf-export').onclick = () => {
    const sp = new URLSearchParams();
    sp.set('export', '1');
    if (codesStatus) sp.set('status', codesStatus);
    if (codesBatchId) sp.set('batch_id', codesBatchId);
    if (codesQ) sp.set('q', codesQ);
    location.href = '/api/admin/codes?' + sp.toString();
  };

  // 按批次作废
  $('#cf-revoke-batch').onclick = async () => {
    if (!codesBatchId) { toast('Select a batch first', 'err'); return; }
    if (!(await confirmDialog(t('codesConfirmRevokeT'), t('codesConfirmRevokeD') + ' Batch: ' + codesBatchId, true))) return;
    try {
      const r = await api('/api/admin/codes/batch-revoke', { method:'POST', body: JSON.stringify({ batch_id: codesBatchId }) });
      toast(t('codesBatchRevokeOk', {n: r.updated || r.count || 0}));
      loadCodes();
    } catch(err) { toast(err.message, 'err'); }
  };

  // 自动选中第一个有效批次（如果还没选），让"按批次作废"等操作立即可用
  if (!codesBatchId && batchOptions.length > 0) {
    codesBatchId = batchOptions[0].batch_id;
    const sel = $('#cf-batch');
    if (sel) sel.value = codesBatchId;
  }

  loadCodesList();
}

async function loadCodesList(){
  const params = new URLSearchParams();
  params.set('page', codesPage);
  params.set('size', 50);
  if (codesStatus) params.set('status', codesStatus);
  if (codesBatchId) params.set('batch_id', codesBatchId);
  if (codesPlan) params.set('plan', codesPlan);
  if (codesQ) params.set('q', codesQ);
  try {
    const d = await api('/api/admin/codes?' + params.toString());
    $('#codes-total-count').textContent = `(${d.total})`;
    if (!d.rows || !d.rows.length) {
      $('#codes-table').innerHTML = `<div class="empty"><div class="icon">🎟️</div>${esc(t('codesNoCodes'))}</div>`;
      $('#codes-pg').innerHTML = '';
      return;
    }
    const statusLabel = { unused: t('codesStatusUnused'), active: t('codesStatusActive'), expired: t('codesStatusExpired'), exhausted: t('codesStatusExhausted'), revoked: t('codesStatusRevoked') };
    const statusColor = { unused: '#9aa4b2', active: '#60a5fa', expired: '#fbbf24', exhausted: '#f87171', revoked: '#a3a3a3' };
    $('#codes-table').innerHTML = `
      <div style="overflow-x:auto">
      <table class="admin-table" style="width:100%;border-collapse:separate;border-spacing:0;font-size:13px">
        <thead>
          <tr style="text-align:left;color:var(--text-2);border-bottom:1px solid var(--stroke)">
            <th style="padding:10px 8px">${esc(t('codesColCode'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColPlan'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColBatch'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColTraffic'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColStatus'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColActivated'))}</th>
            <th style="padding:10px 8px">${esc(t('codesColActions'))}</th>
          </tr>
        </thead>
        <tbody>
          ${d.rows.map(r => {
            const trafficGB = r.traffic_bytes > 0 ? (r.traffic_bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB' : (r.days_valid > 0 ? t('codesUnlimited') : t('codesRemainingInfinite'));
            const usedGB = r.used_bytes > 0 ? (r.used_bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB' : '0';
            const pct = r.pct || 0;
            return `<tr style="border-bottom:1px solid rgba(255,255,255,.06)">
              <td style="padding:10px 8px;font-family:ui-monospace,'SF Mono',monospace;color:#fde68a">${esc(r.code)}</td>
              <td style="padding:10px 8px;color:var(--text-2)">${esc(r.plan_id||'—')}</td>
              <td style="padding:10px 8px;color:var(--text-2)">${esc(r.batch_id||'—')}</td>
              <td style="padding:10px 8px">
                <div>${usedGB} / ${trafficGB}</div>
                ${r.traffic_bytes > 0 ? `<div style="margin-top:4px;height:3px;background:var(--track-bg);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#34d399,#60a5fa);border-radius:2px"></div></div>` : ''}
              </td>
              <td style="padding:10px 8px"><span style="color:${statusColor[r.status]||'#fff'}">${esc(statusLabel[r.status]||r.status)}</span></td>
              <td style="padding:10px 8px;color:var(--text-2)">${fmtTime(r.activated_at)}</td>
              <td style="padding:10px 8px">
                <button class="btn sm" data-query="${esc(r.code)}">${esc(t('codesQueryRemainBtn'))}</button>
                ${r.status !== 'revoked' ? `<button class="btn sm danger" data-revoke="${esc(r.id)}">${esc(t('codesRevokeOne'))}</button>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    `;

    // 行事件
    $$('#codes-table [data-revoke]').forEach(btn => btn.onclick = async () => {
      if (!(await confirmDialog(t('codesConfirmRevokeT'), t('codesConfirmRevokeD'), true))) return;
      try {
        await api('/api/admin/codes/' + btn.dataset.revoke + '/revoke', { method:'POST' });
        toast('OK');
        loadCodesList();
      } catch(err) { toast(err.message, 'err'); }
    });
    $$('#codes-table [data-query]').forEach(btn => btn.onclick = async () => {
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(btn.dataset.query));
        const d = await r.json();
        if (!r.ok) { toast(d.message || t('codesQueryNotFound'), 'err'); return; }
        const rem = d.status.remaining;
        const total = d.status.total;
        if (rem === -1) toast(t('codesQueryResultInfinite'));
        else toast(t('codesQueryResult', { remaining: fmtSize(rem), total: total > 0 ? fmtSize(total) : '∞' }));
      } catch(err) { toast(err.message, 'err'); }
    });

    // 分页
    const pages = Math.ceil(d.total / d.page_size);
    $('#codes-pg').innerHTML = pages > 1 ? `
      <button class="btn sm" ${d.page<=1?'disabled':''} id="pg-prev">${esc(t('prev'))}</button>
      <span style="font-size:13px;color:var(--text-2);align-self:center">${esc(t('pageOf', {a: d.page, b: pages}))}</span>
      <button class="btn sm" ${d.page>=pages?'disabled':''} id="pg-next">${esc(t('next'))}</button>
    ` : '';
    $('#pg-prev')?.addEventListener('click', () => { codesPage--; loadCodesList(); });
    $('#pg-next')?.addEventListener('click', () => { codesPage++; loadCodesList(); });
  } catch(err) { toast(err.message, 'err'); }
}

        <label>${esc(t('tsSitekeyOverride'))}</label>
        <input type="text" id="ts-sko" value="${esc(s.turnstile_sitekey_override ?? '')}" placeholder="0xAAAA..." style="width:100%;padding:10px 12px;border-radius:12px;font-size:13px;color:var(--text);background:var(--sf-input);border:1px solid var(--stroke-strong);outline:none;font-family:ui-monospace,'SF Mono',monospace">
      </div>
      <div class="field">
        <label>${esc(t('tsSecretOverride'))}</label>
        <input type="password" id="ts-secret" value="" placeholder="${s.cloudflare_turnstile_secret || s.turnstile_secret_configured ? esc(t('tsSecretKeep')) : esc(t('tsSecretPlaceholder'))}" style="width:100%;padding:10px 12px;border-radius:12px;font-size:13px;color:var(--text);background:var(--sf-input);border:1px solid var(--stroke-strong);outline:none;font-family:ui-monospace,'SF Mono',monospace">
        <div class="tip" style="line-height:1.6">
          ${s.cloudflare_turnstile_secret
            ? `<span style="color:#6ee7b7">✓ ${esc(t('tsSecretOk'))} — ${esc(t('tsSecretInCloudflare'))}</span>`
            : s.turnstile_secret_configured
              ? `<span style="color:var(--blue)">✓ ${esc(t('tsSecretOk'))} — ${esc(t('tsSecretInDatabase'))}</span>`
              : `<span style="color:#fda293">⚠ ${esc(t('tsSecretMissing'))} — ${esc(t('tsSecretHint'))}</span>`}<br>
          ${s.cloudflare_turnstile_sitekey
            ? `<span style="color:#6ee7b7">✓ Sitekey ${esc(t('tsInCloudflare'))}</span>`
            : s.turnstile_sitekey_override
              ? `<span style="color:var(--blue)">✓ Sitekey ${esc(t('tsInDatabase'))}</span>`
              : `<span style="color:#fde68a">⚠ Sitekey ${esc(t('tsMissingBoth'))}</span>`}
        </div>
      </div>
      <div class="actions" style="margin-top:18px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="ts-save">${esc(t('save'))}</button>
      </div>
    `);
    $('[data-x]')?.addEventListener('click', closeModal);
    $('#ts-save')?.addEventListener('click', async () => {
      const secretVal = $('#ts-secret').value.trim();
      // 处理 Secret 三种状态：空 = 保留原值；非空(非 __keep__) = 更新；用户显式点"清除"走其他路径
      let secretPayload = '__keep__';
      if (secretVal === '') {
        secretPayload = '__keep__'; // 空表示不改
      } else if (secretVal === '__clear__') {
        secretPayload = ''; // 显式清除（目前不用这个，占位）
      } else {
        secretPayload = secretVal;
      }
      const body = {
        turnstile_mode: $('#ts-m').value,
        turnstile_threshold: Number($('#ts-th').value) || 0,
        turnstile_sitekey_override: $('#ts-sko').value.trim(),
        turnstile_secret: secretPayload,
      };
      await api('/api/admin/settings', { method:'PUT', body: JSON.stringify(body) });
      closeModal();
      toast(t('saved'));
      loadSettings();
    });
  });

  // Turnstile 重置访问计数
  $('#ts-reset')?.addEventListener('click', async () => {
    if(!(await confirmDialog(t('tsResetVisits'), t('tsResetVisitsD'), false))) return;
    await api('/api/admin/turnstile/visits', { method:'DELETE' });
    toast(t('tsVisitsReset'));
  });

  // ═══════════════════════════════════
  // OAuth2 Provider CRUD (Modal)
  // ═══════════════════════════════════

  const PROVIDER_PRESETS = {
    github:   { name:'GitHub',    defaultScope:'user:email' },
    google:   { name:'Google',    defaultScope:'openid email profile' },
    microsoft:{ name:'Microsoft', defaultScope:'openid email profile User.Read' },
    discord:  { name:'Discord',   defaultScope:'identify email' },
    custom:   { name:'Custom',    defaultScope:'openid email profile' },
  };
  function openOauthProviderModal(row){
    // row = null 表示新建，否则是已有数据
    const editing = !!row;
    const preset = PROVIDER_PRESETS[row?.provider_type || 'github'];
    openModal(`
      <h3>${esc(editing ? t('oauthEditTitle') : t('oauthAddTitle'))}</h3>
      <div class="sub">${esc(t('oauthGroupD'))}</div>
      <div class="field" style="margin-top:14px">
        <label>${esc(t('oauthLabel'))}</label>
        <input type="text" id="op-label" value="${esc(row?.label || preset.name)}" placeholder="${esc(t('oauthLabel'))}" style="width:100%">
      </div>
      <div class="field">
        <label>${esc(t('oauthProvider'))}</label>
        <select id="op-type" style="width:100%">
          <option value="github" ${row?.provider_type==='github'?'selected':''} style="color:#111">GitHub</option>
          <option value="google" ${row?.provider_type==='google'?'selected':''} style="color:#111">Google</option>
          <option value="microsoft" ${row?.provider_type==='microsoft'?'selected':''} style="color:#111">Microsoft</option>
          <option value="discord" ${row?.provider_type==='discord'?'selected':''} style="color:#111">Discord</option>
          <option value="custom" ${row?.provider_type==='custom'?'selected':''} style="color:#111">Custom / ${esc(t('custom'))}</option>
        </select>
      </div>
      <div class="field">
        <label>${esc(t('oauthClientId'))}</label>
        <input type="text" id="op-cid" value="${esc(row?.client_id || '')}" placeholder="${esc(t('oauthClientId'))}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
      </div>
      <div class="field">
        <label>${esc(t('oauthClientSecret'))}</label>
        <input type="password" id="op-secret" value="" placeholder="${row?.secret_configured ? esc(t('oauthKeepSecret')) : esc(t('oauthClientSecret'))}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        <div class="tip">${esc(t('oauthClientSecretHelp'))}</div>
      </div>
      <div class="field">
        <label>${esc(t('oauthScope'))}</label>
        <input type="text" id="op-scope" value="${esc(row?.scope || preset.defaultScope)}" style="width:100%">
      </div>
      <div id="op-custom-block" style="display:${row?.provider_type==='custom'?'block':'none'}">
        <div class="field">
          <label>${esc(t('oauthCustomAuthorize'))}</label>
          <input type="text" id="op-au" value="${esc(row?.custom_authorize_url || '')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
        <div class="field">
          <label>${esc(t('oauthCustomToken'))}</label>
          <input type="text" id="op-tu" value="${esc(row?.custom_token_url || '')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
        <div class="field">
          <label>${esc(t('oauthCustomUserinfo'))}</label>
          <input type="text" id="op-ui" value="${esc(row?.custom_userinfo_url || '')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
        <div class="field">
          <label>${esc(t('oauthCustomTokenField'))}</label>
          <input type="text" id="oauth-ctf" value="${esc(row?.custom_token_field || 'access_token')}" style="width:100%;font-family:ui-monospace,'SF Mono',monospace">
        </div>
      </div>
      <div class="field" style="margin-top:8px">
        <div style="font-size:12px;color:var(--text-3);line-height:1.6">
          ${esc(t('oauthCallbackUrl'))}:<br>
          <input type="text" readonly value="${esc(window.location.origin)}/oauth/callback" style="width:100%;margin-top:4px;padding:8px 12px;border-radius:10px;font-size:12px;color:var(--blue);background:rgba(0,0,0,.3);border:1px solid var(--stroke);outline:none;font-family:ui-monospace,'SF Mono',monospace" onclick="this.select()">
          <div style="margin-top:4px">${esc(t('oauthCallbackHint'))}</div>
        </div>
      </div>
      <div class="actions" style="margin-top:18px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="op-save">${esc(t('save'))}</button>
      </div>
    `);
    // Provider type 切换 → 显示/隐藏 Custom 块
    $('#op-type')?.addEventListener('change', () => {
      $('#op-custom-block').style.display = $('#op-type').value === 'custom' ? 'block' : 'none';
      const preset = PROVIDER_PRESETS[$('#op-type').value];
      if (preset && $('#op-scope')?.value === '') $('#op-scope').value = preset.defaultScope;
    });
    $('[data-x]')?.addEventListener('click', closeModal);
    $('#op-save')?.addEventListener('click', async () => {
      const body = {
        label: $('#op-label').value.trim(),
        provider_type: $('#op-type').value,
        client_id: $('#op-cid').value.trim(),
        scope: $('#op-scope').value.trim(),
        enabled: row?.enabled !== false, // 默认启用
      };
      const secret = $('#op-secret').value.trim();
      if (secret) body.client_secret = secret; // 非空则更新
      else if (row?.secret_configured) body.client_secret = '__keep__'; // 编辑且未改密码 → 保留
      else body.client_secret = ''; // 新建没填 → 空字符串不加密
      if ($('#op-type').value === 'custom') {
        body.custom_authorize_url = $('#op-au').value.trim();
        body.custom_token_url = $('#op-tu').value.trim();
        body.custom_userinfo_url = $('#op-ui').value.trim();
        body.custom_token_field = $('#oauth-ctf').value.trim() || 'access_token';
      }
      try {
        if (editing) {
          await api(`/api/admin/oauth/providers/${row.id}`, { method:'PUT', body: JSON.stringify(body) });
        } else {
          await api('/api/admin/oauth/providers', { method:'POST', body: JSON.stringify(body) });
        }
        closeModal();
        toast(t('saved'));
        loadSettings();
      } catch(err){ toast(err.message, 'err'); }
    });
  }

  // ═══ OAuth2 总开关：必须"拨动即保存" ═══
  // 原来这个 checkbox 没有绑定任何事件，只有点页面底部「保存设置」才会被读到并提交。
  // 用户拨开关 → 没进库 → 刷新页面 → 自己弹回去，看起来像 bug。
  // 这里改成即时 PUT，并在失败时**回滚 UI**（否则会出现"看着是开的、其实没开"的假象）。
  $('#oauth-enabled')?.addEventListener('change', async (e) => {
    const tgl = e.currentTarget;
    const want = tgl.checked;
    tgl.disabled = true;
    try {
      await api('/api/admin/settings', { method:'PUT', body: JSON.stringify({ oauth_enabled: want }) });
      const enabledN = document.querySelectorAll('#oauth-providers-grid .tag.active').length;
      if (want && !enabledN) {
        // 开关开了但一个 Provider 都没启用 —— 登录页仍然不会出现按钮，必须明确提示
        toast(t('oauthNoEnabled'), 'err');
      } else {
        toast(want ? t('oauthEnabledN', { n: enabledN }) : t('oauthDisabled'));
      }
      loadSettings();   // 用服务端的真实值重绘，开关与状态行保持一致
    } catch (err) {
      tgl.checked = !want;   // 保存失败 → 回滚，绝不让 UI 与真实状态不一致
      toast(String(err.message || err), 'err');
    } finally {
      tgl.disabled = false;
    }
  });

  // 添加 Provider
  $('#oauth-add')?.addEventListener('click', () => openOauthProviderModal(null));

  // 列表里的按钮 —— 事件委托
  $('#oauth-providers-grid')?.addEventListener('click', async (e) => {
    const cfgBtn = e.target.closest('[data-oauth-config]');
    const tglBtn = e.target.closest('[data-oauth-toggle]');
    const delBtn = e.target.closest('[data-oauth-delete]');
    if (!cfgBtn && !tglBtn && !delBtn) return;
    const id = (cfgBtn || tglBtn || delBtn).dataset.oauthConfig || (cfgBtn || tglBtn || delBtn).dataset.oauthToggle || (cfgBtn || tglBtn || delBtn).dataset.oauthDelete;
    if (!id) return;

    if (cfgBtn) {
      // 先拉一次完整数据再打开 Modal
      const list = await api('/api/admin/oauth/providers');
      const row = list.providers.find(p => p.id === id);
      if (row) openOauthProviderModal(row);
    } else if (tglBtn) {
      await api(`/api/admin/oauth/providers/${id}/toggle`, { method:'POST' });
      loadSettings();
    } else if (delBtn) {
      if (!(await confirmDialog(t('confirmDeleteTitle'), t('confirmOAuthDeleteD'), false))) return;
      await api(`/api/admin/oauth/providers/${id}`, { method:'DELETE' });
      loadSettings();
    }
  });

  // 2FA Setup
  $('#twofa-setup')?.addEventListener('click', async () => {
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      const r = await api('/api/admin/2fa/setup', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(r.uri)}`;
      openModal(`
        <h3>${esc(t('twofaSetupT'))}</h3>
        <div class="sub">${esc(t('twofaSetupD1'))}</div>
        <div style="text-align:center;margin:10px 0 8px">
          <img src="${qrUrl}" style="width:200px;height:200px;border-radius:12px;background:#fff;padding:10px">
        </div>
        <div style="margin:10px 0;font-size:13px">
          <div style="color:var(--text-3);margin-bottom:4px">${esc(t('twofaSetupKey'))}:</div>
          <input readonly value="${esc(r.secret)}" style="width:100%;padding:10px 12px;border-radius:10px;font-family:ui-monospace,'SF Mono',monospace;font-size:13px;color:var(--blue);background:rgba(0,0,0,.3);border:1px solid var(--stroke)" onclick="this.select()">
        </div>
        <div class="field" style="margin:12px 0">
          <input type="text" id="2fa-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="${esc(t('twofaSetupCodePh'))}" style="text-align:center;letter-spacing:.4em;font-size:18px">
        </div>
        <div class="actions">
          <button class="btn" data-x>${esc(t('cancel'))}</button>
          <button class="btn primary" id="2fa-enable">${esc(t('confirm'))}</button>
        </div>
      `);
      $('[data-x]').onclick = closeModal;
      $('#2fa-enable').onclick = async () => {
        const code = $('#2fa-code').value.trim();
        if(!/^\d{6}$/.test(code)) return;
        try{
          const en = await api('/api/admin/2fa/enable', { method:'POST', body: JSON.stringify({ admin_key: adminKey, code, secret: r.secret }) });
          closeModal();
          // 展示恢复码
          showRecoveryCodes(en.recovery_codes);
        }catch(err){ toast(err.message, 'err'); }
      };
    }catch(err){ toast(err.message, 'err'); }
  });

  // ── 2FA Disable ──
  $('#twofa-disable')?.addEventListener('click', async () => {
    if(!(await confirmDialog(t('twofaDisableT'), t('twofaDisableD'), true))) return;
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      await api('/api/admin/2fa/disable', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      toast(t('twofaSetupT').includes('开启') ? '2FA 已关闭' : '2FA disabled');
      loadSettings();
    }catch(err){ toast(err.message, 'err'); }
  });

  // ── 2FA Regen Recovery ──
  $('#twofa-regen')?.addEventListener('click', async () => {
    if(!(await confirmDialog(t('twofaRegenT'), t('twofaRegenD'), false))) return;
    const adminKey = await promptAdminKey();
    if(!adminKey) return;
    try{
      const r = await api('/api/admin/2fa/regen-recovery', { method:'POST', body: JSON.stringify({ admin_key: adminKey }) });
      showRecoveryCodes(r.recovery_codes);
    }catch(err){ toast(err.message, 'err'); }
  });
}

function promptAdminKey(){
  return new Promise(resolve => {
    openModal(`
      <h3>${esc(t('twofaAdminKeyPh'))}</h3>
      <form id="pk-form"><input type="password" id="pk-input" autofocus placeholder="${esc(t('keyPlaceholder'))}" style="text-align:center"></form>
      <div class="actions" style="margin-top:16px">
        <button class="btn" data-x>${esc(t('cancel'))}</button>
        <button class="btn primary" id="pk-ok">${esc(t('confirm'))}</button>
      </div>
    `);
    $('[data-x]').onclick = () => { closeModal(); resolve(null); };
    $('#pk-ok').onclick = () => { const v = $('#pk-input').value.trim(); closeModal(); resolve(v || null); };
    $('#pk-form').onsubmit = e => { e.preventDefault(); $('#pk-ok').click(); };
    setTimeout(() => $('#pk-input').focus(), 50);
  });
}

function showRecoveryCodes(codes){
  openModal(`
    <h3>✅ ${esc(t('twofaSetupDone'))}</h3>
    <div class="sub">${esc(t('twofaSetupRecoveryT'))}</div>
    <div style="margin:10px 0">
      <div class="banner" style="border-radius:14px;padding:12px 16px">
        <div class="ic">⚠️</div>
        <div class="t" style="color:#ffd9a0;font-size:13px">${esc(t('twofaSetupRecoveryD'))}</div>
      </div>
      <div style="background:rgba(0,0,0,.3);border-radius:12px;padding:16px;font-family:ui-monospace,'SF Mono',monospace;font-size:14px;color:#fde68a;line-height:1.8">
        ${codes.map(c => `<div>${esc(c)}</div>`).join('')}
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="rc-copy">${esc(t('copy'))}</button>
      <button class="btn primary" data-x>${esc(t('close'))}</button>
    </div>
  `);
  $('#rc-copy').onclick = () => copyText(codes.join('\n')).then(() => toast(t('twofaSetupRecoveryCopied')));
  $('[data-x]').onclick = () => { closeModal(); loadSettings(); };
}

/* ═══════════ 启动 ═══════════ */
(async () => {
  try{
    const s = await api('/api/admin/session');
    siteTitle = s.site_title || siteTitle;
    showApp();
  }catch{
    // 401 已在 api() 里重定向到 /login（带 GitHub 登录按钮的完整登录页）；
    // 走到这里的是其他错误 —— 也别渲染空页面，至少给个内置登录卡片兜底。
    if (!document.querySelector('#login-view')) showLogin();
  }
})();
</script>
</body>
</html>
