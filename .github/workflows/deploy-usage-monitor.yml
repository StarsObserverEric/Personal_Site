name: Deploy usage-monitor (Worker)

# ECNU AI Console 用量监控：Cron 每 2 分钟拉用量接口 → 写 D1（ecnu_usage_log 表）。
#
# ── 安全铁律（与 deploy-netdisk.yml 相同，务必保留）──────────────────────
# 凭证只允许以 shell 变量形式存在于**单个 run 步骤内部**。
# 绝不要把"运行时派生出来的"令牌值写进 $GITHUB_ENV 或 step 的 env: ——
# GitHub 只会给**已注册的 Secret 值**打码；派生值不在注册表里，无法被打码，
# 会被原样明文打印进该仓库的 Actions 日志（公开仓库 = 令牌对全网泄露）。
on:
  workflow_dispatch:
  push:
    paths:
      - "usage-monitor/**"
      - ".github/workflows/deploy-usage-monitor.yml"

jobs:
  deploy-usage-monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usage-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Worker and inject secrets
        env:
          RAW_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          ECNU_COOKIE_RAW: ${{ secrets.ECNU_USAGE_COOKIE }}
          MONITOR_TOKEN_RAW: ${{ secrets.USAGE_MONITOR_TOKEN }}
          AGENT_MAINT_RAW: ${{ secrets.AGENT_MAINTENANCE }}
        run: |
          set -u
          TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "${RAW_ACCOUNT:-}" | tr -d '[:space:]')"

          if ! printf '%s' "$ACCOUNT" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CF_ACCOUNT_ID 非法（清理后 ${#ACCOUNT} 字符，应为 32 位小写十六进制）"
            exit 1
          fi

          # 同 netdisk：容忍 textarea 粘贴污染，自动提取唯一候选（只打印长度，绝不打印值）
          if ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]{40,80}$'; then
            CANDS="$(printf '%s' "$RAW_TOKEN" | tr -c 'A-Za-z0-9_-' '\n' | grep -E '^[A-Za-z0-9_-]{40,80}$' | grep -Ev '^[0-9a-f]{32}$' | sort -u)"
            N="$(printf '%s' "$CANDS" | grep -c .)"
            if [ "$N" = "1" ]; then
              TOKEN="$(printf '%s' "$CANDS" | head -n1)"
              echo "::warning::CF_API_TOKEN 不是纯令牌值，已自动提取唯一候选（${#TOKEN} 字符）。"
            else
              echo "::error::CF_API_TOKEN 无法解析（候选 ${N} 个）。"
              exit 1
            fi
          fi

          export CLOUDFLARE_API_TOKEN="$TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"

          echo "──── 1/2 部署 Worker ────"
          npx --yes wrangler@4 deploy

          # 顺序很重要：先 deploy 建出 Worker，再 secret put（否则找不到目标 Worker）。
          # 缺 Secret 时不阻塞部署：Worker 照常上线，cron 会落 status=error 的行，
          # 提醒你凭证还没配好。补上 Secret 后重跑本 workflow 即可自愈。
          # 只清掉 CR/LF 和首尾空白（cookie 值本身含空格和分号，不能动）。
          COOKIE="$(printf '%s' "${ECNU_COOKIE_RAW:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          MT="$(printf '%s' "${MONITOR_TOKEN_RAW:-}" | tr -d '\r\n[:space:]')"
          echo "──── 2/2 写入监控凭证 ────"
          if [ -z "$COOKIE" ] || [ -z "$MT" ]; then
            echo "::warning::缺少 GitHub Secret ECNU_USAGE_COOKIE（格式：SESSION=...; __access_token=...）或 USAGE_MONITOR_TOKEN。Worker 已部署，但监控凭证未写入。请到仓库 Settings → Secrets and variables → Actions 添加这两个 Secret，然后重跑本 workflow。"
          else
            printf '%s' "$COOKIE" | npx --yes wrangler@4 secret put ECNU_COOKIE
            printf '%s' "$MT" | npx --yes wrangler@4 secret put MONITOR_TOKEN
            echo "::notice::监控凭证已写入（cookie ${#COOKIE} 字符 / token ${#MT} 字符）"
          fi

          # 网盘回写凭证：从现有 AGENT_MAINTENANCE 拆出（两种格式都容忍：
          #   "user:pass" 单行，或两行式"第一行用户名 / 第二行密码"），不新增要保管的秘密
          AM="$(printf '%s' "$AGENT_MAINT_RAW" | tr -d '\r')"
          if printf '%s' "$AM" | grep -q ':'; then
            DISK_USER="$(printf '%s' "${AM%%:*}" | tr -d '[:space:]')"
            DISK_PASS="$(printf '%s' "${AM#*:}" | tr -d '[:space:]')"
          else
            DISK_USER="$(printf '%s\n' "$AM" | sed -n '1{s/[[:space:]]*$//;p}')"
            DISK_PASS="$(printf '%s\n' "$AM" | sed -n '2{s/[[:space:]]*$//;p}')"
          fi
          if [ -n "$DISK_USER" ] && [ -n "$DISK_PASS" ]; then
            printf '%s' "$DISK_USER" | npx --yes wrangler@4 secret put NETDISK_USER
            printf '%s' "$DISK_PASS" | npx --yes wrangler@4 secret put NETDISK_PASS
            echo "::notice::网盘回写凭证已写入（user ${#DISK_USER} 字符 / pass ${#DISK_PASS} 字符）"
          else
            echo "::warning::AGENT_MAINTENANCE 缺失或格式无法解析，跳过网盘凭证写入"
          fi

          # ── 幂等清理：删掉历史遗留的自定义域 usage.starsobservereric.cc.cd（用户不要新域名）──
          echo "──── 3/3 清理历史自定义域 ────"
          DOMAIN_JSON="$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/domains?hostname=usage.starsobservereric.cc.cd")"
          # CF 返回的 domain id 是带连字符的 36 位 UUID
          DOMAIN_ID="$(printf '%s' "$DOMAIN_JSON" | grep -o '"id":"[0-9a-f-]\{32,36\}"' | head -n1 | cut -d'"' -f4)"
          DOMAIN_N="$(printf '%s' "$DOMAIN_JSON" | grep -c '"hostname"' || true)"
          if [ -n "$DOMAIN_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/domains/$DOMAIN_ID" > /dev/null
            echo "::notice::自定义域 usage.starsobservereric.cc.cd 已删除（匹配到 $DOMAIN_N 条记录）"
          else
            echo "自定义域不存在（已清理过），跳过（api success 字段：$(printf '%s' "$DOMAIN_JSON" | grep -o '"success":[a-z]*' | head -n1)）"
          fi
