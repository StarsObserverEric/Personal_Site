name: Deploy netdisk (Worker)

# 手动触发（workflow_dispatch）。首次部署前需在 Cloudflare 控制台建好资源：
#   1) R2 桶: cloud-r2pan            （仅按名字绑定，无需 ID）
#   2) D1 库: cloud-r2pan            → Database ID 已回填 netdisk/wrangler.jsonc
#                                      （10a5da07-2dbd-4944-a72b-a651070b645d）
#   3) 自定义域: 已在 wrangler.jsonc 用 routes[].custom_domain=true 声明，
#      本工作流会把它（disk.starsobservereric.cc.cd）自动绑到 Worker，无需去控制台手点。
#   4) 后台登录密码: 仓库 Secret NETDISK_ADMIN_PASSWORD（本工作流自动注入为 Worker 的 admin 密钥）
#      兼容旧名 NETDISK_ADMIN。上游登录页只校验密码，无用户名字段。
#   5) （可选，对应防刷/DDoS）Turnstile: 控制台申请 sitekey+secret，加到 Worker 的
#      turnstile_sitekey / turnstile_secret 两个变量
# 要求：CF_API_TOKEN 具备 Workers 脚本 / D1 / R2 / Pages 编辑权限（已配齐）。
on:
  workflow_dispatch:

jobs:
  deploy-netdisk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netdisk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 同 deploy.yml：剔除 Secret 值里可能混入的换行/空格，否则 wrangler 会报
      # Headers.set: "..." is an invalid header value.
      - name: Verify Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "${RAW_ACCOUNT:-}" | tr -d '[:space:]')"

          echo "CF_ACCOUNT_ID: 原始 ${#RAW_ACCOUNT} 字符 -> 清理后 ${#ACCOUNT} 字符"
          echo "CF_API_TOKEN : 原始 ${#RAW_TOKEN} 字符 -> 清理后 ${#TOKEN} 字符"

          if ! printf '%s' "$ACCOUNT" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CF_ACCOUNT_ID 格式非法（清理后 ${#ACCOUNT} 字符，应为 32 位小写十六进制）"
            exit 1
          fi

          is_token() {
            printf '%s' "$1" | grep -Eq '^[A-Za-z0-9_-]{40,80}$' || return 1
            printf '%s' "$1" | grep -Eq '^[0-9a-f]{32}$' && return 1
            return 0
          }

          if ! is_token "$TOKEN"; then
            CANDS="$(printf '%s' "$RAW_TOKEN" | tr -c 'A-Za-z0-9_-' '\n' | grep -E '^[A-Za-z0-9_-]{40,80}$' | grep -Ev '^[0-9a-f]{32}$' | sort -u)"
            N="$(printf '%s' "$CANDS" | grep -c . )"
            if [ "$N" = "1" ]; then
              TOKEN="$(printf '%s' "$CANDS" | head -n1)"
              echo "::notice::已自动提取出唯一候选令牌（${#TOKEN} 字符）。"
            else
              echo "::error::CF_API_TOKEN 无法解析出唯一令牌（候选数 ${N}，清理后长度 ${#TOKEN}）。请在 Cloudflare 把令牌 Roll 一次拿到新值，只粘贴那一串值本身。"
              exit 1
            fi
          fi

          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"
          echo "凭证校验通过"

      - name: Install dependencies
        run: npm ci

      # 网盘后台登录密码（上游只认一个名为 admin 的密钥；登录页只问密码，无用户名）。
      # 优先取 NETDISK_ADMIN_PASSWORD，兼容旧名 NETDISK_ADMIN。两者都没设则跳过，
      # 留待你在 Cloudflare 控制台手动加 admin。
      - name: Set netdisk admin password
        if: ${{ secrets.NETDISK_ADMIN_PASSWORD != '' || secrets.NETDISK_ADMIN != '' }}
        env:
          PW_NEW: ${{ secrets.NETDISK_ADMIN_PASSWORD }}
          PW_OLD: ${{ secrets.NETDISK_ADMIN }}
          ADMIN_USER: ${{ secrets.NETDISK_ADMIN_USERNAME }}
        run: |
          PW="$(printf '%s' "${PW_NEW:-${PW_OLD:-}}" | tr -d '\r\n')"
          if [ -z "$PW" ]; then
            echo "::error::后台密码为空（NETDISK_ADMIN_PASSWORD / NETDISK_ADMIN 都没取到值）"
            exit 1
          fi
          printf '%s' "$PW" | npx wrangler secret put admin --remote
          echo "::notice::已把后台登录密码写入 Worker 的 admin 密钥（长度 ${#PW}）。"
          if [ -n "$ADMIN_USER" ]; then
            echo "::notice::检测到 NETDISK_ADMIN_USERNAME，但上游登录页只校验密码、无用户名字段，该 Secret 暂不参与鉴权。"
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
