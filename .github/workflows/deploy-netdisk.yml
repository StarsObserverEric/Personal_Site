name: Deploy netdisk (Worker)

# 手动触发（workflow_dispatch）。前置条件：
#   1) R2 桶 cloud-r2pan                （仅按名字绑定，无需 ID）
#   2) D1 库 cloud-r2pan                → Database ID 已回填 netdisk/wrangler.jsonc
#                                         （10a5da07-2dbd-4944-a72b-a651070b645d）
#   3) 自定义域 disk.starsobservereric.cc.cd
#      → 由 netdisk/wrangler.jsonc 的 routes[].custom_domain=true 在部署时自动绑定
#   4) 后台登录密码 → GitHub Secret NETDISK_ADMIN_PASSWORD（上游登录页只校验密码，无用户名字段）
#   5) （可选，防刷）Turnstile: 控制台申请后加 Worker 变量 turnstile_sitekey / turnstile_secret
#
# ── 安全铁律（踩过的坑，务必保留这段注释）──────────────────────────────
# 凭证只允许以 shell 变量形式存在于**单个 run 步骤内部**。
# 绝不要把"运行时派生出来的"令牌值写进 $GITHUB_ENV 或 step 的 env: ——
# GitHub 只会给**已注册的 Secret 值**打码；派生值不在注册表里，无法被打码，
# 会被原样明文打印进该仓库的 Actions 日志（公开仓库 = 令牌对全网泄露）。
on:
  workflow_dispatch:

jobs:
  deploy-netdisk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netdisk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 顺序很重要：先 deploy 建出 cloud-r2pan 这个 Worker，再 secret put。
      # 反过来的话 wrangler secret put 找不到目标 Worker 会直接失败。
      # 另外本版 wrangler 的 secret put **没有** --remote 参数（加了会报 Unknown argument）。
      - name: Deploy Worker and set admin password
        env:
          RAW_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_PW_NEW: ${{ secrets.NETDISK_ADMIN_PASSWORD }}
          ADMIN_PW_OLD: ${{ secrets.NETDISK_ADMIN }}
          ADMIN_USER: ${{ secrets.NETDISK_ADMIN_USERNAME }}
        run: |
          set -u
          TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "${RAW_ACCOUNT:-}" | tr -d '[:space:]')"

          if ! printf '%s' "$ACCOUNT" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CF_ACCOUNT_ID 非法（清理后 ${#ACCOUNT} 字符，应为 32 位小写十六进制）"
            exit 1
          fi

          # GitHub 的 Secret 输入框是 textarea，整块粘贴会连换行和其他文字一起存进来。
          # 清理后若非纯令牌，就尝试从原始值里挑出唯一候选（只打印长度，绝不打印值）。
          if ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]{40,80}$'; then
            CANDS="$(printf '%s' "$RAW_TOKEN" | tr -c 'A-Za-z0-9_-' '\n' | grep -E '^[A-Za-z0-9_-]{40,80}$' | grep -Ev '^[0-9a-f]{32}$' | sort -u)"
            N="$(printf '%s' "$CANDS" | grep -c . )"
            if [ "$N" = "1" ]; then
              TOKEN="$(printf '%s' "$CANDS" | head -n1)"
              echo "::warning::CF_API_TOKEN 不是纯令牌值，已自动提取唯一候选（${#TOKEN} 字符）。建议把 Secret 重设为纯值。"
            else
              echo "::error::CF_API_TOKEN 无法解析（候选 ${N} 个，清理后 ${#TOKEN} 字符）。请到 Cloudflare Roll 令牌后只粘贴那一串值。"
              exit 1
            fi
          fi

          export CLOUDFLARE_API_TOKEN="$TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          echo "凭证就绪（account ${#ACCOUNT} 字符 / token ${#TOKEN} 字符）"

          echo "──── 1/2 部署 Worker ────"
          npx wrangler deploy

          echo "──── 2/2 写入后台登录密码 ────"
          PW="$(printf '%s' "${ADMIN_PW_NEW:-${ADMIN_PW_OLD:-}}" | tr -d '\r\n')"
          if [ -z "$PW" ]; then
            echo "::warning::未配置 NETDISK_ADMIN_PASSWORD（或 NETDISK_ADMIN），已跳过；请到 Cloudflare 控制台给 cloud-r2pan Worker 手动添加 admin 密钥。"
          else
            printf '%s' "$PW" | npx wrangler secret put admin
            echo "::notice::admin 密码已写入 Worker（长度 ${#PW}）。"
          fi

          if [ -n "${ADMIN_USER:-}" ]; then
            echo "::notice::NETDISK_ADMIN_USERNAME 已设置，但上游登录页只校验密码、无用户名字段，暂不参与鉴权。"
          fi
