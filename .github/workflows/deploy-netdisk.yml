name: Deploy netdisk (Worker)

# 手动触发。首次部署前需先在 Cloudflare 建好：
#   - R2 桶: cloud-r2pan
#   - D1 库: cloud-r2pan  （建好后把 id 填进 netdisk/wrangler.jsonc 的 database_id）
#   - Secret: 在 Worker 上设置 admin（后台管理密码）
# 并确保 GitHub 仓库 Secret 里的 CF_API_TOKEN 具备 Workers 脚本 / D1 / R2 的编辑权限。
on:
  workflow_dispatch:

jobs:
  deploy-netdisk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netdisk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
