name: "cleanup-usage-monitor (一次性删除 Worker，跑完即删本文件)"

# 一次性任务：彻底删除 ecnu-usage-monitor Worker（连同其 secrets / cron 绑定）。
# 验证成功后本 workflow 文件会被下一个 commit 删掉。

on:
  workflow_dispatch:

jobs:
  delete-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ecnu-usage-monitor via CF API
        env:
          RAW_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -u
          TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "${RAW_ACCOUNT:-}" | tr -d '[:space:]')"
          if ! printf '%s' "$ACCOUNT" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CF_ACCOUNT_ID 非法"; exit 1
          fi
          if ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]{40,80}$'; then
            CANDS="$(printf '%s' "$RAW_TOKEN" | tr -c 'A-Za-z0-9_-' '\n' | grep -E '^[A-Za-z0-9_-]{40,80}$' | grep -Ev '^[0-9a-f]{32}$' | sort -u)"
            N="$(printf '%s' "$CANDS" | grep -c .)"
            if [ "$N" = "1" ]; then
              TOKEN="$(printf '%s' "$CANDS" | head -n1)"
            else
              echo "::error::CF_API_TOKEN 无法解析（候选 ${N} 个）"; exit 1
            fi
          fi

          echo "──── 1/2 删除 Worker ecnu-usage-monitor ────"
          HTTP="$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/ecnu-usage-monitor")"
          echo "DELETE HTTP=$HTTP body=$(cat /tmp/del.json)"
          # 200=删成功；404=本来就不存在（幂等重跑）。其他状态码算失败。
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "404" ]; then
            echo "::error::删除失败，见上方响应"; exit 1
          fi

          echo "──── 2/2 复查账户下剩余 Worker 脚本 ────"
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts" \
            | grep -o '"id":"[^"]*"' || true
